<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inventario Yumana</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a14; --surface:#13131f; --surface2:#1a1a2a; --border:#2a2a44;
  --gold:#c9a84c; --gold-bright:#e6ca7a; --text:#e8e2d4; --muted:#7a7a8e;
  --green:#27ae60; --green-soft:#76e08a; --red:#e74c3c; --orange:#f39c12; --blue:#3498db;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:-apple-system, system-ui, 'Helvetica Neue', sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; padding:16px;
  padding-bottom:40px;
}
.header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border);
}
.header h1{
  font-family:Georgia, serif; font-size:22px; color:var(--gold-bright);
  font-weight:600; letter-spacing:0.5px;
}
.header .sub{font-size:12px; color:var(--muted); margin-top:2px;}
.refresh-btn{
  background:var(--surface); border:1px solid var(--border); color:var(--gold);
  width:42px; height:42px; border-radius:12px; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.refresh-btn:active{background:var(--surface2);}
.search-box{position:relative; margin-bottom:20px;}
.search-box input{
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:14px; padding:16px 16px 16px 48px; color:var(--text);
  font-size:16px; outline:none;
}
.search-box input:focus{border-color:var(--gold);}
.search-box .icon{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  font-size:18px; color:var(--muted);
}
.hint{font-size:13px; color:var(--muted); text-align:center; margin:30px 0;}
.result-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px; margin-bottom:12px;
}
.result-card .desc{font-size:16px; font-weight:600; color:var(--text); margin-bottom:4px;}
.result-card .meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
.result-card .code{color:var(--gold); font-weight:600;}
.result-card .price{color:var(--green-soft); font-weight:600;}
.ubic-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px; background:var(--surface2); border-radius:8px; margin-bottom:6px;
}
.ubic-row .name{font-size:14px; color:var(--text);}
.ubic-row .qty{font-size:15px; font-weight:700;}
.qty.has{color:var(--green-soft);}
.qty.zero{color:var(--muted);}
.total-line{
  display:flex; justify-content:space-between; margin-top:10px; padding-top:10px;
  border-top:1px solid var(--border); font-size:14px;
}
.total-line .lbl{color:var(--muted);}
.total-line .val{color:var(--gold-bright); font-weight:700;}
.badge{
  display:inline-block; font-size:10px; padding:2px 8px; border-radius:6px;
  margin-left:8px; vertical-align:middle;
}
.badge.activo{background:rgba(39,174,96,0.2); color:var(--green-soft);}
.badge.inactivo{background:rgba(122,122,142,0.2); color:var(--muted);}
.loading{text-align:center; color:var(--muted); padding:20px; font-size:14px;}
.error{
  background:rgba(231,76,60,0.15); border:1px solid var(--red); color:var(--red);
  padding:12px; border-radius:10px; font-size:13px; margin-bottom:16px;
}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📦 Inventario Yumana</h1>
    <div class="sub">Consulta de existencias</div>
  </div>
  <button class="refresh-btn" onclick="location.reload()">🔄</button>
</div>

<div class="search-box">
  <span class="icon">🔍</span>
  <input type="text" id="search" placeholder="Buscar: tv 32, nevera mabe, RF-168..." autocomplete="off">
</div>

<div id="results"></div>
<div class="hint" id="hint">Escribe el nombre o código de un producto para ver dónde está y cuánto hay.</div>

<script>
const SUPABASE_URL = 'https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const searchInput = document.getElementById('search');
const resultsEl = document.getElementById('results');
const hintEl = document.getElementById('hint');
let timer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(timer);
  const q = searchInput.value.trim();
  if (q.length < 2) { resultsEl.innerHTML = ''; hintEl.style.display='block'; return; }
  timer = setTimeout(() => buscar(q), 350);
});

async function buscar(q) {
  hintEl.style.display = 'none';
  resultsEl.innerHTML = '<div class="loading">Buscando...</div>';
  try {
    const { data: productos, error } = await sb
      .from('inv_productos')
      .select('id, codigo_valery, descripcion, categoria, precio_usd, activo')
      .or(`descripcion.ilike.%${q}%,codigo_valery.ilike.%${q}%`)
      .order('activo', { ascending: false })
      .limit(25);
    if (error) throw error;
    if (!productos || productos.length === 0) {
      resultsEl.innerHTML = '<div class="hint">No se encontró ningún producto con "'+q+'".</div>';
      return;
    }
    const ids = productos.map(p => p.id);
    const { data: existencias } = await sb
      .from('inv_existencias')
      .select('producto_id, ubicacion, existencia')
      .in('producto_id', ids);
    renderResultados(productos, existencias || []);
  } catch (e) {
    resultsEl.innerHTML = '<div class="error">Error al buscar: '+e.message+'</div>';
  }
}

function renderResultados(productos, existencias) {
  let html = '';
  for (const p of productos) {
    const exs = existencias.filter(e => e.producto_id === p.id);
    const total = exs.reduce((s,e) => s + Number(e.existencia||0), 0);
    const precio = p.precio_usd ? '$'+Number(p.precio_usd).toFixed(2) : '—';
    const badge = p.activo
      ? '<span class="badge activo">Activo</span>'
      : '<span class="badge inactivo">Agotado</span>';
    let ubicHtml = '';
    const conStock = exs.filter(e => Number(e.existencia) > 0);
    if (conStock.length === 0) {
      ubicHtml = '<div class="ubic-row"><span class="name" style="color:var(--muted)">Sin existencias registradas</span></div>';
    } else {
      for (const e of conStock.sort((a,b)=>b.existencia-a.existencia)) {
        ubicHtml += `<div class="ubic-row"><span class="name">${e.ubicacion}</span><span class="qty has">${e.existencia}</span></div>`;
      }
    }
    html += `
      <div class="result-card">
        <div class="desc">${p.descripcion}${badge}</div>
        <div class="meta"><span class="code">${p.codigo_valery}</span> · ${p.categoria||''} · <span class="price">${precio}</span></div>
        ${ubicHtml}
        <div class="total-line"><span class="lbl">Total en todas las ubicaciones</span><span class="val">${total} und</span></div>
      </div>`;
  }
  resultsEl.innerHTML = html;
}
</script>
</body>
</html>
