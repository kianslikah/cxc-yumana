<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inventario_Yumana_App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a14; --surface:#13131f; --surface2:#1a1a2a; --border:#2a2a44;
  --gold:#c9a84c; --gold-bright:#e6ca7a; --text:#e8e2d4; --muted:#7a7a8e;
  --green:#27ae60; --green-soft:#76e08a; --red:#e74c3c; --orange:#f39c12; --blue:#3498db;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system, system-ui, 'Helvetica Neue', sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-bottom:60px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.header h1{font-family:Georgia, serif;font-size:22px;color:var(--gold-bright);font-weight:600;}
.header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
.refresh-btn{background:var(--surface);border:1px solid var(--border);color:var(--gold);width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;}
.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab{flex:1;padding:12px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;}
.tab.active{background:var(--gold);color:#0a0a14;border-color:var(--gold);}
.view{display:none;}
.view.active{display:block;}
.search-box{position:relative;margin-bottom:18px;}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 16px 16px 48px;color:var(--text);font-size:16px;outline:none;}
.search-box input:focus{border-color:var(--gold);}
.search-box .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:30px 0;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.result-card .desc{font-size:16px;font-weight:600;margin-bottom:4px;}
.result-card .meta{font-size:12px;color:var(--muted);margin-bottom:12px;}
.result-card .code{color:var(--gold);font-weight:600;}
.result-card .price{color:var(--green-soft);font-weight:600;}
.ubic-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface2);border-radius:8px;margin-bottom:6px;}
.ubic-row .name{font-size:14px;}
.ubic-row .qty{font-size:15px;font-weight:700;}
.qty.has{color:var(--green-soft);}
.total-line{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:14px;}
.total-line .lbl{color:var(--muted);}
.total-line .val{color:var(--gold-bright);font-weight:700;}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;}
.badge.activo{background:rgba(39,174,96,0.2);color:var(--green-soft);}
.badge.inactivo{background:rgba(122,122,142,0.2);color:var(--muted);}
.loading{text-align:center;color:var(--muted);padding:20px;font-size:14px;}
.error{background:rgba(231,76,60,0.15);border:1px solid var(--red);color:var(--red);padding:12px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.field-label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block;}
select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:16px;outline:none;margin-bottom:14px;-webkit-appearance:none;}
select:focus{border-color:var(--gold);}
.count-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.count-card .cdesc{font-size:15px;font-weight:600;margin-bottom:2px;}
.count-card .cmeta{font-size:11px;color:var(--muted);margin-bottom:10px;}
.count-card .ccode{color:var(--gold);}
.counter{display:flex;align-items:center;gap:10px;}
.counter button{width:46px;height:46px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--gold-bright);font-size:24px;font-weight:700;cursor:pointer;flex-shrink:0;}
.counter button:active{background:var(--gold);color:#0a0a14;}
.counter input{flex:1;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);font-size:20px;font-weight:700;outline:none;}
.counter input:focus{border-color:var(--gold);}
.save-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 16px;background:var(--surface);border-top:1px solid var(--border);display:none;}
.save-bar.show{display:block;}
.save-btn{width:100%;padding:16px;background:var(--green);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.save-btn:active{opacity:0.85;}
.save-btn:disabled{opacity:0.5;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:100;display:none;}
.toast.show{display:block;}
.count-info{font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px;}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📦 Inventario Yumana</h1>
    <div class="sub">Control de existencias</div>
  </div>
  <button class="refresh-btn" onclick="location.reload()">🔄</button>
</div>

<div class="tabs">
  <div class="tab active" id="tabConsultar" onclick="showView('consultar')">🔍 Consultar</div>
  <div class="tab" id="tabContar" onclick="showView('contar')">📝 Contar</div>
</div>

<!-- VISTA CONSULTAR -->
<div class="view active" id="vConsultar">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="search" placeholder="Buscar: tv 32, nevera mabe, RF-168..." autocomplete="off">
  </div>
  <div id="results"></div>
  <div class="hint" id="hint">Escribe el nombre o código de un producto para ver dónde está y cuánto hay.</div>
</div>

<!-- VISTA CONTAR -->
<div class="view" id="vContar">
  <label class="field-label">¿En qué depósito estás contando?</label>
  <select id="selUbicacion"><option value="">Selecciona ubicación...</option></select>
  <label class="field-label">¿Qué categoría vas a contar?</label>
  <select id="selCategoria"><option value="">Selecciona categoría...</option></select>
  <div class="count-info" id="countInfo"></div>
  <div id="countList"></div>
</div>

<div class="save-bar" id="saveBar">
  <button class="save-btn" id="btnGuardar" onclick="guardarConteo()">Guardar conteo</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showView(v){
  document.getElementById('vConsultar').classList.toggle('active', v==='consultar');
  document.getElementById('vContar').classList.toggle('active', v==='contar');
  document.getElementById('tabConsultar').classList.toggle('active', v==='consultar');
  document.getElementById('tabContar').classList.toggle('active', v==='contar');
  document.getElementById('saveBar').classList.toggle('show', v==='contar' && document.getElementById('countList').children.length>0);
  if(v==='contar') initContar();
}

/* ===== CONSULTAR ===== */
const searchInput=document.getElementById('search');
const resultsEl=document.getElementById('results');
const hintEl=document.getElementById('hint');
let timer=null;
searchInput.addEventListener('input',()=>{
  clearTimeout(timer);
  const q=searchInput.value.trim();
  if(q.length<2){resultsEl.innerHTML='';hintEl.style.display='block';return;}
  timer=setTimeout(()=>buscar(q),350);
});
async function buscar(q){
  hintEl.style.display='none';
  resultsEl.innerHTML='<div class="loading">Buscando...</div>';
  try{
    const{data:productos,error}=await sb.from('inv_productos')
      .select('id, codigo_valery, descripcion, categoria, precio_usd, activo')
      .or(`descripcion.ilike.%${q}%,codigo_valery.ilike.%${q}%`)
      .order('activo',{ascending:false}).limit(25);
    if(error)throw error;
    if(!productos||productos.length===0){resultsEl.innerHTML='<div class="hint">No se encontró ningún producto con "'+q+'".</div>';return;}
    const ids=productos.map(p=>p.id);
    const{data:existencias}=await sb.from('inv_existencias').select('producto_id, ubicacion, existencia').in('producto_id',ids);
    renderResultados(productos,existencias||[]);
  }catch(e){resultsEl.innerHTML='<div class="error">Error al buscar: '+e.message+'</div>';}
}
function renderResultados(productos,existencias){
  let html='';
  for(const p of productos){
    const exs=existencias.filter(e=>e.producto_id===p.id);
    const total=exs.reduce((s,e)=>s+Number(e.existencia||0),0);
    const precio=p.precio_usd?'$'+Number(p.precio_usd).toFixed(2):'—';
    const badge=p.activo?'<span class="badge activo">Activo</span>':'<span class="badge inactivo">Agotado</span>';
    let ubicHtml='';
    const conStock=exs.filter(e=>Number(e.existencia)>0);
    if(conStock.length===0){ubicHtml='<div class="ubic-row"><span class="name" style="color:var(--muted)">Sin existencias registradas</span></div>';}
    else{for(const e of conStock.sort((a,b)=>b.existencia-a.existencia)){ubicHtml+=`<div class="ubic-row"><span class="name">${e.ubicacion}</span><span class="qty has">${e.existencia}</span></div>`;}}
    html+=`<div class="result-card"><div class="desc">${p.descripcion}${badge}</div><div class="meta"><span class="code">${p.codigo_valery}</span> · ${p.categoria||''} · <span class="price">${precio}</span></div>${ubicHtml}<div class="total-line"><span class="lbl">Total en todas las ubicaciones</span><span class="val">${total} und</span></div></div>`;
  }
  resultsEl.innerHTML=html;
}

/* ===== CONTAR ===== */
let ubicacionesCargadas=false;
let categoriasCargadas=false;
async function initContar(){
  if(!ubicacionesCargadas){
    const{data}=await sb.from('inv_ubicaciones').select('id, nombre').eq('activo',true).order('id');
    if(data){
      const sel=document.getElementById('selUbicacion');
      data.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.nombre;sel.appendChild(o);});
      ubicacionesCargadas=true;
    }
  }
  if(!categoriasCargadas){
    const{data}=await sb.from('inv_productos').select('categoria').eq('activo',true);
    if(data){
      const cats=[...new Set(data.map(d=>d.categoria).filter(Boolean))].sort();
      const sel=document.getElementById('selCategoria');
      cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
      categoriasCargadas=true;
    }
  }
}
document.getElementById('selUbicacion').addEventListener('change',cargarListaConteo);
document.getElementById('selCategoria').addEventListener('change',cargarListaConteo);

async function cargarListaConteo(){
  const ubic=document.getElementById('selUbicacion').value;
  const cat=document.getElementById('selCategoria').value;
  const listEl=document.getElementById('countList');
  const infoEl=document.getElementById('countInfo');
  if(!ubic||!cat){listEl.innerHTML='';document.getElementById('saveBar').classList.remove('show');return;}
  listEl.innerHTML='<div class="loading">Cargando productos...</div>';
  try{
    const{data:productos,error}=await sb.from('inv_productos')
      .select('id, codigo_valery, descripcion, corriente').eq('categoria',cat).eq('activo',true).order('descripcion');
    if(error)throw error;
    if(!productos||productos.length===0){listEl.innerHTML='<div class="hint">No hay productos activos en esta categoría.</div>';return;}
    const ids=productos.map(p=>p.id);
    const{data:ex}=await sb.from('inv_existencias').select('producto_id, existencia').eq('ubicacion_id',ubic).in('producto_id',ids);
    const exMap={};(ex||[]).forEach(e=>{exMap[e.producto_id]=Number(e.existencia||0);});
    infoEl.textContent=`${productos.length} productos en esta categoría · escribe lo que veas físicamente`;
    let html='';
    for(const p of productos){
      const actual=exMap[p.id]||0;
      html+=`<div class="count-card" data-pid="${p.id}"><div class="cdesc">${p.descripcion}</div><div class="cmeta"><span class="ccode">${p.codigo_valery}</span>${p.corriente?' · '+p.corriente:''}</div><div class="counter"><button onclick="ajustar(${p.id},-1)">−</button><input type="number" inputmode="numeric" id="cnt_${p.id}" value="${actual}" min="0"><button onclick="ajustar(${p.id},1)">+</button></div></div>`;
    }
    listEl.innerHTML=html;
    document.getElementById('saveBar').classList.add('show');
  }catch(e){listEl.innerHTML='<div class="error">Error: '+e.message+'</div>';}
}
function ajustar(pid,delta){
  const inp=document.getElementById('cnt_'+pid);
  let v=parseInt(inp.value||'0',10)+delta;
  if(v<0)v=0;inp.value=v;
}
async function guardarConteo(){
  const ubic=document.getElementById('selUbicacion').value;
  if(!ubic)return;
  const btn=document.getElementById('btnGuardar');
  const cards=document.querySelectorAll('.count-card');
  const pids=[...cards].map(c=>parseInt(c.dataset.pid,10));
  btn.disabled=true;btn.textContent='Revisando...';
  try{
    // ¿Ya hay conteo previo de estos productos en este depósito?
    const{data:previos}=await sb.from('inv_movimientos')
      .select('id').eq('tipo','ajuste').eq('estado','confirmado')
      .eq('ubicacion_destino',parseInt(ubic,10)).in('producto_id',pids);
    let anularIds=[];
    if(previos&&previos.length>0){
      const ok=confirm('Ya contaste esta categoría en este depósito antes ('+previos.length+' registros).\n\n¿Reemplazar el conteo anterior con este nuevo?\n\nAceptar = reemplazar · Cancelar = no guardar');
      if(!ok){btn.disabled=false;btn.textContent='Guardar conteo';return;}
      anularIds=previos.map(p=>p.id);
    }
    btn.textContent='Guardando...';
    // Anular conteos previos (no se borran, quedan como anulados)
    if(anularIds.length>0){
      await sb.from('inv_movimientos').update({estado:'anulado'}).in('id',anularIds);
    }
    const movs=[];
    cards.forEach(c=>{
      const pid=parseInt(c.dataset.pid,10);
      const cant=parseInt(document.getElementById('cnt_'+pid).value||'0',10);
      movs.push({producto_id:pid,tipo:'ajuste',cantidad_confirmada:cant,cantidad_solicitada:cant,ubicacion_destino:parseInt(ubic,10),estado:'confirmado',referencia:'Conteo inicial',usuario:'Kinan',confirmado_en:new Date().toISOString()});
    });
    const{error}=await sb.from('inv_movimientos').insert(movs);
    if(error)throw error;
    showToast('✓ Conteo guardado ('+movs.length+' productos)');
    btn.disabled=false;btn.textContent='Guardar conteo';
  }catch(e){showToast('Error: '+e.message);btn.disabled=false;btn.textContent='Guardar conteo';}
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
