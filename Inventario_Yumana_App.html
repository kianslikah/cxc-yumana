<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inventario_Yumana_App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
  --bg:#0b0b12; --bg-grad1:#12121e; --bg-grad2:#0a0a10;
  --surface:#15151f; --surface2:#1d1d2b; --surface-hover:#22222f;
  --border:#2c2c40; --border-soft:#232331;
  --gold:#c9a24c; --gold-bright:#e8cd83; --gold-dim:#8c7536;
  --text:#ece6d8; --text2:#b8b2a6; --muted:#6f6f82;
  --green:#2ec27a; --green-soft:#7fe6a8; --red:#e85d4c; --orange:#f0a838; --blue:#4ba3e0;
  --shadow:0 8px 32px rgba(0,0,0,0.45); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
  --glow:0 0 0 1px rgba(201,162,76,0.15), 0 4px 24px rgba(201,162,76,0.08);
}
:root[data-theme="light"]{
  --bg:#f4f2ec; --bg-grad1:#faf8f2; --bg-grad2:#eeebe2;
  --surface:#ffffff; --surface2:#f6f4ee; --surface-hover:#efece3;
  --border:#ddd8cb; --border-soft:#e8e4d8;
  --gold:#9a7d2e; --gold-bright:#b8923a; --gold-dim:#c9b888;
  --text:#23211a; --text2:#54514a; --muted:#8f8b7e;
  --green:#1f9d5e; --green-soft:#2ec27a; --red:#cc4434; --orange:#d18820; --blue:#2f7fc0;
  --shadow:0 8px 32px rgba(120,110,80,0.12); --shadow-sm:0 2px 12px rgba(120,110,80,0.08);
  --glow:0 0 0 1px rgba(154,125,46,0.15), 0 4px 24px rgba(154,125,46,0.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Outfit',-apple-system,system-ui,sans-serif;
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-grad1), transparent),radial-gradient(ellipse 70% 50% at 100% 100%, var(--bg-grad2), transparent);
  background-attachment:fixed;
  color:var(--text);min-height:100vh;padding:20px 16px 60px;
  transition:background-color .4s ease,color .3s ease;
}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);}
.brand{display:flex;flex-direction:column;gap:3px;}
.brand .logo-row{display:flex;align-items:center;gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold-bright),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow-sm);}
.brand h1{font-family:'Fraunces',Georgia,serif;font-size:23px;font-weight:600;letter-spacing:-0.3px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:500;margin-left:44px;}
.head-actions{display:flex;gap:8px;}
.icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--gold);width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:all .2s ease;}
.icon-btn:active{transform:scale(0.92);background:var(--surface-hover);}
.tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--surface);padding:6px;border-radius:15px;border:1px solid var(--border-soft);box-shadow:var(--shadow-sm);}
.tab{flex:1;padding:13px;text-align:center;border-radius:11px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;transition:all .25s ease;letter-spacing:0.2px;}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#0b0b12;box-shadow:var(--shadow-sm);}
:root[data-theme="light"] .tab.active{color:#fff;}
.view{display:none;animation:fadeUp .4s ease;}
.view.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.search-box{position:relative;margin-bottom:20px;}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:17px 17px 17px 50px;color:var(--text);font-size:16px;font-family:inherit;outline:none;box-shadow:var(--shadow-sm);transition:all .2s ease;}
.search-box input:focus{border-color:var(--gold);box-shadow:var(--glow);}
.search-box input::placeholder{color:var(--muted);}
.search-box .icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--gold);opacity:.7;}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:36px 16px;line-height:1.6;}
.result-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:18px;margin-bottom:13px;box-shadow:var(--shadow-sm);transition:all .2s ease;animation:fadeUp .35s ease backwards;}
.result-card:hover{border-color:var(--border);}
.result-card .desc{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:5px;letter-spacing:-0.2px;}
.result-card .meta{font-size:12px;color:var(--text2);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.result-card .code{color:var(--gold);font-weight:600;font-family:'Outfit';letter-spacing:0.5px;}
.result-card .price{color:var(--green-soft);font-weight:700;}
.dot{color:var(--muted);opacity:.5;}
.ubic-row{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--surface2);border-radius:11px;margin-bottom:7px;border:1px solid transparent;}
.ubic-row .name{font-size:14px;color:var(--text2);font-weight:500;}
.ubic-row .qty{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.qty.has{color:var(--green-soft);}
.total-line{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:13px;border-top:1px solid var(--border-soft);}
.total-line .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;}
.total-line .val{font-family:'Fraunces',serif;color:var(--gold-bright);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:3px 9px;border-radius:7px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
.badge.activo{background:rgba(46,194,122,0.15);color:var(--green-soft);border:1px solid rgba(46,194,122,0.25);}
.badge.inactivo{background:rgba(111,111,130,0.12);color:var(--muted);border:1px solid rgba(111,111,130,0.2);}
.loading{text-align:center;color:var(--muted);padding:30px;font-size:14px;}
.error{background:rgba(232,93,76,0.12);border:1px solid rgba(232,93,76,0.3);color:var(--red);padding:14px;border-radius:12px;font-size:13px;margin-bottom:16px;}
.field-label{font-size:12px;color:var(--muted);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.select-wrap{position:relative;margin-bottom:18px;}
.select-wrap::after{content:'▾';position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none;font-size:14px;}
select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--text);font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;box-shadow:var(--shadow-sm);transition:all .2s ease;}
select:focus{border-color:var(--gold);box-shadow:var(--glow);}
.count-info{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 16px;letter-spacing:0.3px;}
.count-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:15px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow-sm);animation:fadeUp .3s ease backwards;}
.count-card .cdesc{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:3px;}
.count-card .cmeta{font-size:11px;color:var(--text2);margin-bottom:12px;}
.count-card .ccode{color:var(--gold);font-weight:600;letter-spacing:0.5px;}
.counter{display:flex;align-items:center;gap:11px;}
.counter button{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--gold-bright);font-size:24px;font-weight:600;cursor:pointer;flex-shrink:0;transition:all .15s ease;display:flex;align-items:center;justify-content:center;}
.counter button:active{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#0b0b12;transform:scale(0.9);}
.counter input{flex:1;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px;color:var(--text);font-size:21px;font-weight:700;font-family:'Fraunces',serif;outline:none;font-variant-numeric:tabular-nums;}
.counter input:focus{border-color:var(--gold);box-shadow:var(--glow);}
.save-bar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:var(--surface);border-top:1px solid var(--border);display:none;box-shadow:0 -8px 32px rgba(0,0,0,0.25);backdrop-filter:blur(10px);}
.save-bar.show{display:block;}
.save-btn{width:100%;padding:17px;background:linear-gradient(135deg,var(--green),#1f9d5e);border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:0.3px;box-shadow:var(--shadow-sm);transition:all .2s ease;}
.save-btn:active{transform:scale(0.98);}
.save-btn:disabled{opacity:0.5;}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);background:linear-gradient(135deg,var(--green),#1f9d5e);color:#fff;padding:14px 26px;border-radius:13px;font-size:14px;font-weight:600;z-index:100;box-shadow:var(--shadow);opacity:0;transition:all .35s cubic-bezier(.2,.8,.2,1);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="logo-row">
      <div class="mark">📦</div>
      <h1>Inventario Yumana</h1>
    </div>
    <div class="sub">Control de Existencias</div>
  </div>
  <div class="head-actions">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn" onclick="location.reload()">🔄</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tabConsultar" onclick="showView('consultar')">Consultar</div>
  <div class="tab" id="tabContar" onclick="showView('contar')">Contar</div>
</div>

<div class="view active" id="vConsultar">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="search" placeholder="Buscar: tv 32, nevera mabe, RF-168..." autocomplete="off">
  </div>
  <div id="results"></div>
  <div class="hint" id="hint">Escribe el nombre o código de un producto para ver dónde está y cuánto hay disponible.</div>
</div>

<div class="view" id="vContar">
  <label class="field-label">¿En qué depósito estás contando?</label>
  <div class="select-wrap"><select id="selUbicacion"><option value="">Selecciona ubicación...</option></select></div>
  <label class="field-label">¿Qué categoría vas a contar?</label>
  <div class="select-wrap"><select id="selCategoria"><option value="">Selecciona categoría...</option></select></div>
  <div class="count-info" id="countInfo"></div>
  <div id="countList"></div>
</div>

<div class="save-bar" id="saveBar">
  <button class="save-btn" id="btnGuardar" onclick="guardarConteo()">Guardar conteo</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY='sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function toggleTheme(){
  const r=document.documentElement;
  const next=r.getAttribute('data-theme')==='dark'?'light':'dark';
  r.setAttribute('data-theme',next);
  document.getElementById('themeBtn').textContent=next==='dark'?'🌙':'☀️';
}

function showView(v){
  document.getElementById('vConsultar').classList.toggle('active',v==='consultar');
  document.getElementById('vContar').classList.toggle('active',v==='contar');
  document.getElementById('tabConsultar').classList.toggle('active',v==='consultar');
  document.getElementById('tabContar').classList.toggle('active',v==='contar');
  document.getElementById('saveBar').classList.toggle('show',v==='contar'&&document.getElementById('countList').children.length>0);
  if(v==='contar')initContar();
}

const searchInput=document.getElementById('search');
const resultsEl=document.getElementById('results');
const hintEl=document.getElementById('hint');
let timer=null;
searchInput.addEventListener('input',()=>{
  clearTimeout(timer);
  const q=searchInput.value.trim();
  if(q.length<2){resultsEl.innerHTML='';hintEl.style.display='block';return;}
  timer=setTimeout(()=>buscar(q),350);
});
async function buscar(q){
  hintEl.style.display='none';
  resultsEl.innerHTML='<div class="loading">Buscando...</div>';
  try{
    const{data:productos,error}=await sb.from('inv_productos')
      .select('id, codigo_valery, descripcion, categoria, precio_usd, activo')
      .or(`descripcion.ilike.%${q}%,codigo_valery.ilike.%${q}%`)
      .order('activo',{ascending:false}).limit(25);
    if(error)throw error;
    if(!productos||productos.length===0){resultsEl.innerHTML='<div class="hint">No se encontró ningún producto con "'+q+'".</div>';return;}
    const ids=productos.map(p=>p.id);
    const{data:existencias}=await sb.from('inv_existencias').select('producto_id, ubicacion, existencia').in('producto_id',ids);
    renderResultados(productos,existencias||[]);
  }catch(e){resultsEl.innerHTML='<div class="error">Error al buscar: '+e.message+'</div>';}
}
function renderResultados(productos,existencias){
  let html='';let i=0;
  for(const p of productos){
    const exs=existencias.filter(e=>e.producto_id===p.id);
    const total=exs.reduce((s,e)=>s+Number(e.existencia||0),0);
    const precio=p.precio_usd?'$'+Number(p.precio_usd).toFixed(2):'—';
    const badge=p.activo?'<span class="badge activo">Activo</span>':'<span class="badge inactivo">Agotado</span>';
    let ubicHtml='';
    const conStock=exs.filter(e=>Number(e.existencia)>0);
    if(conStock.length===0){ubicHtml='<div class="ubic-row"><span class="name" style="opacity:.6">Sin existencias registradas</span></div>';}
    else{for(const e of conStock.sort((a,b)=>b.existencia-a.existencia)){ubicHtml+=`<div class="ubic-row"><span class="name">${e.ubicacion}</span><span class="qty has">${e.existencia}</span></div>`;}}
    html+=`<div class="result-card" style="animation-delay:${i*0.04}s"><div class="desc">${p.descripcion} ${badge}</div><div class="meta"><span class="code">${p.codigo_valery}</span><span class="dot">•</span>${p.categoria||''}<span class="dot">•</span><span class="price">${precio}</span></div>${ubicHtml}<div class="total-line"><span class="lbl">Total en bodegas</span><span class="val">${total} und</span></div></div>`;
    i++;
  }
  resultsEl.innerHTML=html;
}

let ubicacionesCargadas=false,categoriasCargadas=false;
async function initContar(){
  if(!ubicacionesCargadas){
    const{data}=await sb.from('inv_ubicaciones').select('id, nombre').eq('activo',true).order('id');
    if(data){const sel=document.getElementById('selUbicacion');data.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.nombre;sel.appendChild(o);});ubicacionesCargadas=true;}
  }
  if(!categoriasCargadas){
    const{data}=await sb.from('inv_productos').select('categoria').eq('activo',true);
    if(data){const cats=[...new Set(data.map(d=>d.categoria).filter(Boolean))].sort();const sel=document.getElementById('selCategoria');cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});categoriasCargadas=true;}
  }
}
document.getElementById('selUbicacion').addEventListener('change',cargarListaConteo);
document.getElementById('selCategoria').addEventListener('change',cargarListaConteo);
async function cargarListaConteo(){
  const ubic=document.getElementById('selUbicacion').value;
  const cat=document.getElementById('selCategoria').value;
  const listEl=document.getElementById('countList');
  const infoEl=document.getElementById('countInfo');
  if(!ubic||!cat){listEl.innerHTML='';document.getElementById('saveBar').classList.remove('show');return;}
  listEl.innerHTML='<div class="loading">Cargando productos...</div>';
  try{
    const{data:productos,error}=await sb.from('inv_productos').select('id, codigo_valery, descripcion, corriente').eq('categoria',cat).eq('activo',true).order('descripcion');
    if(error)throw error;
    if(!productos||productos.length===0){listEl.innerHTML='<div class="hint">No hay productos activos en esta categoría.</div>';return;}
    const ids=productos.map(p=>p.id);
    const{data:ex}=await sb.from('inv_existencias').select('producto_id, existencia').eq('ubicacion_id',ubic).in('producto_id',ids);
    const exMap={};(ex||[]).forEach(e=>{exMap[e.producto_id]=Number(e.existencia||0);});
    infoEl.textContent=productos.length+' productos · escribe o usa los botones';
    let html='';let i=0;
    for(const p of productos){
      const actual=exMap[p.id]||0;
      html+=`<div class="count-card" data-pid="${p.id}" style="animation-delay:${i*0.03}s"><div class="cdesc">${p.descripcion}</div><div class="cmeta"><span class="ccode">${p.codigo_valery}</span>${p.corriente?' · '+p.corriente:''}</div><div class="counter"><button onclick="ajustar(${p.id},-1)">−</button><input type="number" inputmode="numeric" id="cnt_${p.id}" value="${actual}" min="0"><button onclick="ajustar(${p.id},1)">+</button></div></div>`;
      i++;
    }
    listEl.innerHTML=html;
    document.getElementById('saveBar').classList.add('show');
  }catch(e){listEl.innerHTML='<div class="error">Error: '+e.message+'</div>';}
}
function ajustar(pid,delta){
  const inp=document.getElementById('cnt_'+pid);
  let v=parseInt(inp.value||'0',10)+delta;
  if(v<0)v=0;inp.value=v;
}
async function guardarConteo(){
  const ubic=document.getElementById('selUbicacion').value;
  if(!ubic)return;
  const btn=document.getElementById('btnGuardar');
  const cards=document.querySelectorAll('.count-card');
  const pids=[...cards].map(c=>parseInt(c.dataset.pid,10));
  btn.disabled=true;btn.textContent='Revisando...';
  try{
    const{data:previos}=await sb.from('inv_movimientos').select('id').eq('tipo','ajuste').eq('estado','confirmado').eq('ubicacion_destino',parseInt(ubic,10)).in('producto_id',pids);
    let anularIds=[];
    if(previos&&previos.length>0){
      const ok=confirm('Ya contaste esta categoría en este depósito antes ('+previos.length+' registros).\n\n¿Reemplazar el conteo anterior con este nuevo?\n\nAceptar = reemplazar · Cancelar = no guardar');
      if(!ok){btn.disabled=false;btn.textContent='Guardar conteo';return;}
      anularIds=previos.map(p=>p.id);
    }
    btn.textContent='Guardando...';
    if(anularIds.length>0){await sb.from('inv_movimientos').update({estado:'anulado'}).in('id',anularIds);}
    const movs=[];
    cards.forEach(c=>{
      const pid=parseInt(c.dataset.pid,10);
      const cant=parseInt(document.getElementById('cnt_'+pid).value||'0',10);
      movs.push({producto_id:pid,tipo:'ajuste',cantidad_confirmada:cant,cantidad_solicitada:cant,ubicacion_destino:parseInt(ubic,10),estado:'confirmado',referencia:'Conteo inicial',usuario:'Kinan',confirmado_en:new Date().toISOString()});
    });
    const{error}=await sb.from('inv_movimientos').insert(movs);
    if(error)throw error;
    showToast('✓ Conteo guardado ('+movs.length+' productos)');
    btn.disabled=false;btn.textContent='Guardar conteo';
  }catch(e){showToast('Error: '+e.message);btn.disabled=false;btn.textContent='Guardar conteo';}
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
