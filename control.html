<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Control — Mercantil Yumana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0f14;--bg-2:#141821;--surface:#1a1f2b;--surface-2:#212838;
    --border:#2a3344;--border-soft:#222a38;
    --gold:#d4a24e;--gold-soft:#e8c583;--gold-deep:#9c7330;
    --text:#eef2f8;--text-2:#9aa6b8;--muted:#5f6b80;
    --green:#4ea876;--red:#e8755c;--blue:#5b9bd5;--orange:#f0a838;
    --glow:0 0 0 3px rgba(212,162,78,0.18);
    --shadow:0 18px 50px rgba(0,0,0,0.45);--shadow-sm:0 6px 18px rgba(0,0,0,0.3);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  body{background:radial-gradient(1200px 600px at 80% -10%, rgba(212,162,78,0.07), transparent 60%),var(--bg);}
  ::selection{background:rgba(212,162,78,0.3);}

  /* LOGIN */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border);border-radius:24px;padding:44px 36px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .brand-mark{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .brand-emblem{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:#1a1206;}
  .brand-name{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1;}
  .brand-sub{font-size:12px;color:var(--gold-soft);letter-spacing:3px;text-transform:uppercase;margin-top:3px;font-weight:500;}
  .login-title{font-family:'Fraunces',serif;font-size:27px;font-weight:500;margin:34px 0 6px;}
  .login-desc{color:var(--text-2);font-size:14px;margin-bottom:28px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600;}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:13px;padding:15px 16px;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:all .2s ease;}
  .field input:focus{border-color:var(--gold);box-shadow:var(--glow);}
  .btn-login{width:100%;margin-top:10px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1206;border:none;border-radius:13px;padding:16px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s ease;box-shadow:0 8px 20px rgba(212,162,78,0.28);}
  .btn-login:hover{transform:translateY(-1px);}
  .btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
  .login-msg{margin-top:16px;font-size:14px;text-align:center;min-height:20px;}
  .login-msg.error{color:var(--red);}

  /* SHELL con sidebar */
  #appView{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:248px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--border-soft);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .side-brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px;margin-bottom:8px;border-bottom:1px solid var(--border-soft);}
  .side-emblem{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:21px;color:#1a1206;flex-shrink:0;}
  .side-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.1;}
  .side-title small{display:block;font-family:'Outfit',sans-serif;font-size:9px;letter-spacing:2px;color:var(--gold-soft);text-transform:uppercase;margin-top:3px;font-weight:500;}
  .nav{flex:1;margin-top:14px;display:flex;flex-direction:column;gap:4px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;color:var(--text-2);font-size:14.5px;font-weight:500;cursor:pointer;transition:all .18s ease;border:1px solid transparent;}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;}
  .nav-item:hover{background:var(--surface);color:var(--text);}
  .nav-item.active{background:var(--surface-2);color:var(--gold-soft);border-color:var(--border);}
  .nav-item.soon{opacity:0.5;}
  .nav-item.soon .tag{margin-left:auto;font-size:9px;letter-spacing:1px;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:2px 6px;border-radius:5px;}
  .side-foot{padding-top:16px;border-top:1px solid var(--border-soft);}
  .side-user{display:flex;align-items:center;gap:10px;padding:8px;}
  .side-avatar{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--gold-soft);}
  .side-user .un{font-size:13px;font-weight:600;line-height:1.2;}
  .side-user .ur{font-size:10px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:1px;}
  .side-links{display:flex;gap:8px;margin-top:10px;}
  .side-links a,.side-links button{flex:1;text-align:center;background:transparent;border:1px solid var(--border);color:var(--text-2);border-radius:9px;padding:9px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .18s ease;text-decoration:none;}
  .side-links a:hover{border-color:var(--gold);color:var(--gold-soft);}
  .side-links button:hover{border-color:var(--red);color:var(--red);}

  .content{flex:1;padding:40px 40px 90px;max-width:1100px;}
  .page-head{margin-bottom:30px;}
  .page-head h1{font-family:'Fraunces',serif;font-size:30px;font-weight:500;line-height:1.15;}
  .page-head p{color:var(--text-2);font-size:14.5px;margin-top:7px;max-width:640px;line-height:1.5;}

  /* matriz permisos */
  .matrix-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:16px;background:linear-gradient(180deg,var(--surface),var(--bg-2));}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th,td{padding:15px 16px;text-align:left;border-bottom:1px solid var(--border-soft);}
  thead th{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-soft);font-weight:600;background:rgba(0,0,0,0.15);}
  thead th:first-child{font-family:'Fraunces',serif;font-size:14px;letter-spacing:0;text-transform:none;color:var(--text);}
  tbody tr:last-child td{border-bottom:none;}
  .app-cell{display:flex;align-items:center;gap:11px;}
  .app-cell .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);flex-shrink:0;}
  .app-cell .ic svg{width:17px;height:17px;}
  .app-cell .nm{font-weight:600;font-size:14.5px;}
  .app-cell .ds{font-size:11.5px;color:var(--muted);}
  .perm-select{width:100%;min-width:124px;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;transition:all .2s ease;}
  .perm-select:focus{border-color:var(--gold);box-shadow:var(--glow);}
  .perm-select[data-nivel="completo"]{border-color:rgba(78,168,118,0.5);color:var(--green);}
  .perm-select[data-nivel="consulta"]{border-color:rgba(91,155,213,0.5);color:var(--blue);}
  .perm-select[data-nivel="ninguno"]{border-color:var(--border);color:var(--muted);}
  .legend{margin-top:16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);}
  .legend span{display:inline-flex;align-items:center;gap:7px;}
  .dot{width:10px;height:10px;border-radius:3px;}
  .dot-full{background:var(--green);}.dot-view{background:var(--blue);}.dot-none{background:var(--muted);}

  /* usuarios */
  .user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .user-card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--border-soft);border-radius:15px;padding:20px;display:flex;align-items:center;gap:14px;}
  .user-card .av{width:46px;height:46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--gold-soft);flex-shrink:0;}
  .user-card .un{font-weight:600;font-size:15.5px;}
  .role-pill{display:inline-block;margin-top:5px;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:6px;}
  .role-admin{background:rgba(212,162,78,0.16);color:var(--gold-soft);}
  .role-cajera{background:rgba(78,168,118,0.14);color:var(--green);}
  .role-logistica{background:rgba(91,155,213,0.14);color:var(--blue);}
  .role-lectura{background:rgba(154,166,184,0.12);color:var(--text-2);}

  .soon-box{text-align:center;padding:70px 20px;border:1px dashed var(--border);border-radius:18px;color:var(--text-2);}
  .soon-box .ic{width:54px;height:54px;margin:0 auto 16px;color:var(--muted);}
  .soon-box h3{font-family:'Fraunces',serif;font-size:21px;color:var(--text);margin-bottom:8px;}

  .resumen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;}
  .rsm-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow-sm);}
  .rsm-card-lbl{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.8px;font-weight:600;}
  .rsm-card-num{font-family:'Fraunces',serif;font-size:34px;font-weight:600;color:var(--gold-bright);margin-top:10px;line-height:1;}
  .rsm-card-nota{font-size:12px;color:var(--muted);margin-top:8px;}
  .rsm-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .rsm-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
  .rsm-panel h3{font-family:'Fraunces',serif;font-size:17px;color:var(--text);margin-bottom:14px;}
  .rsm-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:14px;}
  .rsm-row:last-child{border-bottom:none;}
  .rsm-lbl{color:var(--text-2);text-transform:capitalize;}
  .rsm-val{color:var(--text);font-weight:600;}
  @media(max-width:760px){.resumen-grid{grid-template-columns:1fr;}.rsm-panels{grid-template-columns:1fr;}}
  .resumen-grid-5{grid-template-columns:repeat(5,1fr);}
  @media(max-width:980px){.resumen-grid-5{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:760px){.resumen-grid-5{grid-template-columns:1fr;}}
  .rsm-stock-cero{color:var(--red)!important;}
  .rsm-stock-bajo{color:var(--orange)!important;}

  .denied{text-align:center;padding:100px 20px;color:var(--text-2);}
  .denied h2{font-family:'Fraunces',serif;font-size:26px;color:var(--text);margin-bottom:10px;}

  .savebar{position:fixed;bottom:0;left:248px;right:0;background:rgba(13,15,20,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:15px 28px;display:none;align-items:center;justify-content:space-between;gap:16px;z-index:30;}
  .savebar.show{display:flex;}
  .savebar .info{font-size:14px;color:var(--gold-soft);}
  .btn-save{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1206;border:none;border-radius:11px;padding:12px 24px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s ease;}
  .btn-save:hover{transform:translateY(-1px);}
  .btn-save:disabled{opacity:0.6;cursor:not-allowed;}
  .toast{position:fixed;bottom:80px;left:calc(50% + 124px);transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:13px 20px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:40;}
  .toast.show{opacity:1;}
  .loader{display:inline-block;width:17px;height:17px;border:2px solid rgba(26,18,6,0.3);border-top-color:#1a1206;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .mobile-top{display:none;}
  @media (max-width:820px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow);}
    .sidebar.open{transform:translateX(0);}
    .content{padding:20px 18px 90px;}
    .savebar{left:0;}
    .toast{left:50%;}
    .mobile-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(13,15,20,0.9);backdrop-filter:blur(12px);z-index:20;}
    .mobile-top .mt-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
    .burger{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:45;}
    .scrim.show{display:block;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <div class="brand-mark">
      <div class="brand-emblem">Y</div>
      <div><div class="brand-name">Mercantil Yumana</div><div class="brand-sub">Dueño</div></div>
    </div>
    <div class="login-title">Centro de Control</div>
    <div class="login-desc">Panel del dueño. Solo administradores.</div>
    <div class="field"><label>Correo</label><input type="email" id="email" placeholder="tu@correo.com" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn-login" id="btnLogin">Entrar</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<div id="appView">
  <div class="scrim" id="scrim"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="side-emblem">Y</div>
        <div class="side-title">Centro de Control<small>Mercantil Yumana</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div class="side-user">
          <div class="side-avatar" id="sideAvatar">—</div>
          <div><div class="un" id="sideName">—</div><div class="ur" id="sideRole">—</div></div>
        </div>
        <div class="side-links">
          <a href="portal.html">← Portal</a>
          <button id="btnLogout">Salir</button>
        </div>
      </div>
    </aside>

    <div style="flex:1;display:flex;flex-direction:column;">
      <div class="mobile-top">
        <button class="burger" id="burger">☰</button>
        <div class="mt-title">Centro de Control</div>
        <div style="width:40px;"></div>
      </div>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<div class="savebar" id="savebar">
  <div class="info" id="saveInfo">Tienes cambios sin guardar.</div>
  <button class="btn-save" id="btnSave">Guardar cambios</button>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY='sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ROLES=[
  {id:'admin',nombre:'Admin'},
  {id:'cajera',nombre:'Cajera'},
  {id:'logistica',nombre:'Logística'},
  {id:'lectura',nombre:'Lectura'}
];

let currentUserApp=null;
let APPS=[], MATRIZ={}, CAMBIOS={};
let VISTA_ACTUAL='permisos';

function ico(nombre){
  var P='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
  var paths={
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    boxes:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    wallet:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
    truck:'<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>'
  };
  return P+(paths[nombre]||paths.boxes)+'</svg>';
}

const SECCIONES=[
  {id:'resumen',  nombre:'Resumen del día', icono:'pulse', soon:false},
  {id:'permisos', nombre:'Permisos',        icono:'shield', soon:false},
  {id:'usuarios', nombre:'Usuarios',        icono:'users', soon:false},
  {id:'inventario',nombre:'Inventario',     icono:'boxes', soon:false}
];

async function checkSession(){
  try{ var s=await sb.auth.getSession(); if(s.data.session&&s.data.session.user){ await cargarUsuario(s.data.session.user); } }catch(e){}
}

async function login(){
  var email=document.getElementById('email').value.trim();
  var password=document.getElementById('password').value;
  var msg=document.getElementById('loginMsg');var btn=document.getElementById('btnLogin');
  msg.className='login-msg';msg.textContent='';
  if(!email||!password){msg.className='login-msg error';msg.textContent='Escribe tu correo y contraseña.';return;}
  btn.disabled=true;btn.innerHTML='<span class="loader"></span>';
  try{
    var result=await sb.auth.signInWithPassword({email:email,password:password});
    if(result.error) throw result.error;
    await cargarUsuario(result.data.user);
  }catch(e){
    msg.className='login-msg error';
    msg.textContent=(e.message&&/invalid/i.test(e.message))?'Correo o contraseña incorrectos.':('No se pudo entrar: '+e.message);
    btn.disabled=false;btn.textContent='Entrar';
  }
}

async function cargarUsuario(user){
  var r=await sb.from('usuarios_app').select('*').eq('id',user.id).single();
  if(r.error||!r.data){
    document.getElementById('loginMsg').className='login-msg error';
    document.getElementById('loginMsg').textContent='Tu usuario no tiene rol asignado.';
    await sb.auth.signOut();
    var b=document.getElementById('btnLogin');if(b){b.disabled=false;b.textContent='Entrar';}
    return;
  }
  currentUserApp=r.data;
  document.getElementById('loginView').style.display='none';
  document.getElementById('appView').style.display='block';
  var nombre=currentUserApp.nombre||'Usuario', rol=currentUserApp.rol||'lectura';
  document.getElementById('sideName').textContent=nombre;
  document.getElementById('sideRole').textContent=rol;
  document.getElementById('sideAvatar').textContent=(nombre[0]||'U').toUpperCase();
  if(rol!=='admin'){ renderDenegado(); return; }
  renderNav();
  irA('permisos');
}

function renderDenegado(){
  document.getElementById('nav').innerHTML='';
  document.getElementById('content').innerHTML=
    '<div class="denied"><h2>Acceso restringido</h2>'+
    '<p>El Centro de Control es solo para administradores. Tu rol es <strong>'+(currentUserApp.rol||'—')+'</strong>.</p>'+
    '<p style="margin-top:18px;"><a href="portal.html" style="color:var(--gold-soft);">← Volver al portal</a></p></div>';
}

function renderNav(){
  var nav=document.getElementById('nav');
  nav.innerHTML=SECCIONES.map(function(s){
    return '<div class="nav-item'+(s.soon?' soon':'')+'" data-sec="'+s.id+'">'+ico(s.icono)+'<span>'+s.nombre+'</span>'+(s.soon?'<span class="tag">Pronto</span>':'')+'</div>';
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(function(it){
    it.addEventListener('click',function(){ irA(this.dataset.sec); cerrarSidebarMovil(); });
  });
}

function irA(sec){
  VISTA_ACTUAL=sec;
  document.querySelectorAll('.nav-item').forEach(function(it){ it.classList.toggle('active', it.dataset.sec===sec); });
  // limpiar cambios al cambiar de sección
  CAMBIOS={}; actualizarSaveBar();
  if(sec==='permisos') renderPermisos();
  else if(sec==='usuarios') renderUsuarios();
  else if(sec==='resumen') renderResumen();
  else if(sec==='inventario') renderInventario();
  else renderProximamente(sec);
}

/* ===== PERMISOS ===== */
async function renderPermisos(){
  var c=document.getElementById('content');
  c.innerHTML='<div class="page-head"><h1>Permisos</h1><p>Define qué ve y hace cada rol en cada herramienta. Los cambios se aplican cuando cada usuario recarga su portal.</p></div><div style="padding:30px;text-align:center;color:var(--text-2);">Cargando...</div>';
  try{
    var ra=await sb.from('portal_apps').select('*').order('orden');
    if(ra.error) throw ra.error;
    APPS=ra.data||[];
    var rp=await sb.from('portal_permisos').select('rol, app_id, nivel');
    if(rp.error) throw rp.error;
    MATRIZ={};
    APPS.forEach(function(a){ MATRIZ[a.id]={}; ROLES.forEach(function(r){ MATRIZ[a.id][r.id]='ninguno'; }); });
    (rp.data||[]).forEach(function(p){ if(MATRIZ[p.app_id]) MATRIZ[p.app_id][p.rol]=p.nivel; });
    CAMBIOS={};
    var thRoles=ROLES.map(function(r){ return '<th>'+r.nombre+'</th>'; }).join('');
    var filas=APPS.map(function(a){
      var celdas=ROLES.map(function(r){
        var nivel=MATRIZ[a.id][r.id];
        return '<td><select class="perm-select" data-app="'+a.id+'" data-rol="'+r.id+'" data-nivel="'+nivel+'">'+
          '<option value="completo"'+(nivel==='completo'?' selected':'')+'>Completo</option>'+
          '<option value="consulta"'+(nivel==='consulta'?' selected':'')+'>Solo consulta</option>'+
          '<option value="ninguno"'+(nivel==='ninguno'?' selected':'')+'>Sin acceso</option>'+
        '</select></td>';
      }).join('');
      return '<tr><td><div class="app-cell"><div class="ic">'+ico(a.icono)+'</div><div><div class="nm">'+a.nombre+'</div><div class="ds">'+(a.descripcion||'')+'</div></div></div></td>'+celdas+'</tr>';
    }).join('');
    c.innerHTML='<div class="page-head"><h1>Permisos</h1><p>Define qué ve y hace cada rol en cada herramienta. Los cambios se aplican cuando cada usuario recarga su portal.</p></div>'+
      '<div class="matrix-wrap"><table><thead><tr><th>Herramienta</th>'+thRoles+'</tr></thead><tbody>'+filas+'</tbody></table></div>'+
      '<div class="legend"><span><span class="dot dot-full"></span>Completo — usa la herramienta</span><span><span class="dot dot-view"></span>Solo consulta — ve pero no modifica</span><span><span class="dot dot-none"></span>Sin acceso — no aparece en su portal</span></div>';
    document.querySelectorAll('.perm-select').forEach(function(sel){
      sel.addEventListener('change',function(){
        var app=this.dataset.app, rol=this.dataset.rol, nivel=this.value;
        this.dataset.nivel=nivel;
        var clave=rol+'|'+app;
        if(nivel===MATRIZ[app][rol]) delete CAMBIOS[clave];
        else CAMBIOS[clave]={rol:rol,app_id:app,nivel:nivel};
        actualizarSaveBar();
      });
    });
  }catch(e){ c.innerHTML='<div class="denied"><h2>Error</h2><p>'+e.message+'</p></div>'; }
}

function actualizarSaveBar(){
  var n=Object.keys(CAMBIOS).length;
  var bar=document.getElementById('savebar');
  if(n>0 && VISTA_ACTUAL==='permisos'){ bar.classList.add('show'); document.getElementById('saveInfo').textContent='Tienes '+n+' cambio'+(n>1?'s':'')+' sin guardar.'; }
  else bar.classList.remove('show');
}

async function guardar(){
  var btn=document.getElementById('btnSave');
  var cambios=Object.keys(CAMBIOS).map(function(k){ return CAMBIOS[k]; });
  if(cambios.length===0) return;
  btn.disabled=true;btn.innerHTML='<span class="loader"></span>';
  try{
    var aBorrar=cambios.filter(function(c){ return c.nivel==='ninguno'; });
    var aGuardar=cambios.filter(function(c){ return c.nivel!=='ninguno'; });
    for(var i=0;i<aBorrar.length;i++){
      var c=aBorrar[i];
      var rd=await sb.from('portal_permisos').delete().eq('rol',c.rol).eq('app_id',c.app_id);
      if(rd.error) throw rd.error;
    }
    if(aGuardar.length>0){
      var ru=await sb.from('portal_permisos').upsert(aGuardar,{onConflict:'rol,app_id'});
      if(ru.error) throw ru.error;
    }
    cambios.forEach(function(c){ MATRIZ[c.app_id][c.rol]=c.nivel; });
    CAMBIOS={}; actualizarSaveBar();
    toast('Permisos guardados.');
    btn.disabled=false;btn.textContent='Guardar cambios';
  }catch(e){ toast('Error: '+e.message); btn.disabled=false;btn.textContent='Guardar cambios'; }
}

/* ===== USUARIOS ===== */
async function renderUsuarios(){
  var c=document.getElementById('content');
  c.innerHTML='<div class="page-head"><h1>Usuarios</h1><p>Personas con acceso al sistema y su rol asignado.</p></div><div style="padding:30px;text-align:center;color:var(--text-2);">Cargando...</div>';

  }catch(e){ c.innerHTML='<div class="denied"><h2>Error</h2><p>'+e.message+'</p></div>'; }
}

/* ===== RESUMEN DEL DÍA ===== */
function fmtUSD(n){ return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function renderResumen(){
  var c=document.getElementById('content');
  c.innerHTML='<div class="page-head"><h1>Resumen del día</h1><p>Cargando cifras de hoy…</p></div>';
  try{
    // Rango de hoy (desde medianoche)
    var hoy=new Date(); hoy.setHours(0,0,0,0);
    var inicioHoy=hoy.toISOString();

    // Traer ventas de hoy (solo columnas confirmadas)
    var { data:ventas, error:errV } = await sb
      .from('inv_ventas')
      .select('total,estado,metodo_pago,registrado_por,fecha')
      .gte('fecha', inicioHoy);
    if(errV) throw errV;
    ventas = ventas || [];

    // Entregas pendientes (de cualquier día, no solo hoy)
    var { count:pendientes, error:errP } = await sb
      .from('inv_ventas')
      .select('id', { count:'exact', head:true })
      .eq('estado','pendiente_retirar');
    if(errP) throw errP;

    // Cálculos del día (excluyendo anuladas)
    var validas = ventas.filter(function(v){ return v.estado!=='anulado'; });
    var cantVentas = validas.length;
    var dineroHoy = validas.reduce(function(s,v){ return s+(Number(v.total)||0); }, 0);
    var anuladas = ventas.length - validas.length;

    // Desglose por método de pago
    var porMetodo={};
    validas.forEach(function(v){
      var m=(v.metodo_pago||'Sin método');
      if(!porMetodo[m]) porMetodo[m]={n:0,monto:0};
      porMetodo[m].n++; porMetodo[m].monto+=(Number(v.total)||0);
    });

    // Desglose por quién registró
    var porUsuario={};
    validas.forEach(function(v){
      var u=(v.registrado_por||'Desconocido');
      if(!porUsuario[u]) porUsuario[u]={n:0,monto:0};
      porUsuario[u].n++; porUsuario[u].monto+=(Number(v.total)||0);
    });

    // Si no hay ventas hoy
    if(cantVentas===0){
      c.innerHTML=
        '<div class="page-head"><h1>Resumen del día</h1><p>'+new Date().toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long'})+'</p></div>'+
        '<div class="resumen-grid">'+
          tarjeta('Ventas de hoy','0','aún sin ventas registradas')+
          tarjeta('Dinero de hoy',fmtUSD(0),'')+
          tarjeta('Entregas pendientes',String(pendientes||0),'por retirar')+
        '</div>'+
        '<div class="soon-box"><div class="ic">'+ico('pulse')+'</div><h3>Sin ventas todavía hoy</h3><p>Cuando se registre la primera venta del día, aquí verás el detalle por método de pago y por persona.</p></div>';
      return;
    }

    // Construir tarjetas de método de pago
    var filasMetodo=Object.keys(porMetodo).map(function(m){
      return '<div class="rsm-row"><span class="rsm-lbl">'+escapeHtml(m)+'</span><span class="rsm-val">'+porMetodo[m].n+' · '+fmtUSD(porMetodo[m].monto)+'</span></div>';
    }).join('');

    // Construir tarjetas por usuario
    var filasUsuario=Object.keys(porUsuario).map(function(u){
      return '<div class="rsm-row"><span class="rsm-lbl">'+escapeHtml(u)+'</span><span class="rsm-val">'+porUsuario[u].n+' · '+fmtUSD(porUsuario[u].monto)+'</span></div>';
    }).join('');

    c.innerHTML=
      '<div class="page-head"><h1>Resumen del día</h1><p>'+new Date().toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long'})+'</p></div>'+
      '<div class="resumen-grid">'+
        tarjeta('Ventas de hoy',String(cantVentas),anuladas>0?(anuladas+' anulada'+(anuladas>1?'s':'')):'')+
        tarjeta('Dinero de hoy',fmtUSD(dineroHoy),'')+
        tarjeta('Entregas pendientes',String(pendientes||0),'por retirar')+
      '</div>'+
      '<div class="rsm-panels">'+
        '<div class="rsm-panel"><h3>Por método de pago</h3>'+filasMetodo+'</div>'+
        '<div class="rsm-panel"><h3>Quién registró</h3>'+filasUsuario+'</div>'+
      '</div>';
  }catch(e){
    c.innerHTML='<div class="page-head"><h1>Resumen del día</h1></div><div class="denied"><h2>No se pudo cargar</h2><p>'+escapeHtml(e.message||String(e))+'</p></div>';
  }
}

function tarjeta(titulo,valor,nota){
  return '<div class="rsm-card"><div class="rsm-card-lbl">'+titulo+'</div><div class="rsm-card-num">'+valor+'</div>'+(nota?'<div class="rsm-card-nota">'+nota+'</div>':'')+'</div>';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }

/* ===== INVENTARIO RESUMEN ===== */
async function renderInventario(){
  var c=document.getElementById('content');
  c.innerHTML='<div class="page-head"><h1>Inventario</h1><p>Calculando existencias…</p></div>';
  try{
    var UMBRAL_BAJO=3;

    // Productos activos (id, modelo, descripcion, precio)
    var { data:productos, error:errP } = await sb
      .from('inv_productos')
      .select('id,modelo,descripcion,precio_usd,activo')
      .eq('activo', true);
    if(errP) throw errP;
    productos = productos || [];

    // Existencias por ubicación (sumamos por producto)
    var { data:existencias, error:errE } = await sb
      .from('inv_existencias')
      .select('producto_id,existencia');
    if(errE) throw errE;
    existencias = existencias || [];

    // Sumar existencia total por producto_id
    var stockPorProd={};
    existencias.forEach(function(e){
      var pid=e.producto_id;
      stockPorProd[pid]=(stockPorProd[pid]||0)+(Number(e.existencia)||0);
    });

    // Calcular métricas
    var totalUnidades=0, valorVenta=0, bajoStock=[], sinStock=0;
    productos.forEach(function(p){
      var stock=stockPorProd[p.id]||0;
      totalUnidades+=stock;
      valorVenta+=stock*(Number(p.precio_usd)||0);
      if(stock===0) sinStock++;
      else if(stock<=UMBRAL_BAJO) bajoStock.push({modelo:p.modelo,desc:p.descripcion,stock:stock});
    });
    bajoStock.sort(function(a,b){ return a.stock-b.stock; });

    // Tarjetas
    var grid=
      tarjeta('Productos activos',String(productos.length),'en catálogo')+
      tarjeta('Unidades en stock',totalUnidades.toLocaleString('en-US'),'')+
      tarjeta('Valor (precio venta)',fmtUSD(valorVenta),'')+
      tarjeta('Bajo stock',String(bajoStock.length),'3 o menos unidades')+
      tarjeta('Sin stock',String(sinStock),'productos en cero');

    // Lista de productos bajo stock
    var listaBajo='';
    if(bajoStock.length>0){
      var filas=bajoStock.slice(0,30).map(function(p){
        var nombre=escapeHtml((p.modelo||'')+(p.desc?(' — '+p.desc):''));
        var cls=p.stock===0?'rsm-stock-cero':(p.stock<=1?'rsm-stock-bajo':'');
        return '<div class="rsm-row"><span class="rsm-lbl">'+nombre+'</span><span class="rsm-val '+cls+'">'+p.stock+' u</span></div>';
      }).join('');
      var extra=bajoStock.length>30?'<div class="rsm-card-nota" style="margin-top:10px">…y '+(bajoStock.length-30)+' más</div>':'';
      listaBajo='<div class="rsm-panel" style="margin-top:16px"><h3>Productos a reponer ('+bajoStock.length+')</h3>'+filas+extra+'</div>';
    } else {
      listaBajo='<div class="soon-box" style="padding:40px 20px;margin-top:16px"><h3>Stock sano</h3><p>Ningún producto activo está en 3 unidades o menos.</p></div>';
    }

    c.innerHTML=
      '<div class="page-head"><h1>Inventario</h1><p>Estado de existencias al '+new Date().toLocaleDateString('es-VE',{day:'numeric',month:'long',year:'numeric'})+'</p></div>'+
      '<div class="resumen-grid resumen-grid-5">'+grid+'</div>'+
      listaBajo;
  }catch(e){
    c.innerHTML='<div class="page-head"><h1>Inventario</h1></div><div class="denied"><h2>No se pudo cargar</h2><p>'+escapeHtml(e.message||String(e))+'</p></div>';
  }
}

/* ===== PRÓXIMAMENTE ===== */
function renderProximamente(sec){
  var meta=SECCIONES.find(function(s){ return s.id===sec; })||{nombre:'Sección'};
  var txt = sec==='resumen'
    ? 'Aquí verás un vistazo del día: ventas, dinero, entregas hechas y pendientes, y quién hizo qué. Lo construimos con calma para que los números salgan exactos.'
    : 'Aquí verás el estado del inventario: productos con bajo stock, los más vendidos y el valor total. Lo construimos con calma para que los datos sean confiables.';
  document.getElementById('content').innerHTML=
    '<div class="page-head"><h1>'+meta.nombre+'</h1></div>'+
    '<div class="soon-box"><div class="ic">'+ico(meta.icono)+'</div><h3>En construcción</h3><p>'+txt+'</p></div>';
}

/* ===== util ===== */
var toastTimer=null;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg;t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },3000); }
async function logout(){ await sb.auth.signOut(); location.reload(); }

document.getElementById('btnLogin').addEventListener('click',login);
document.getElementById('password').addEventListener('keydown',function(e){ if(e.key==='Enter')login(); });
document.getElementById('btnLogout').addEventListener('click',logout);
document.getElementById('btnSave').addEventListener('click',guardar);
document.getElementById('burger').addEventListener('click',function(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('scrim').classList.toggle('show'); });
document.getElementById('scrim').addEventListener('click',cerrarSidebarMovil);

checkSession();
