<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Proveedores — Mercantil Yumana</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d;--bg2:#141414;--bg3:#1c1c1c;--bg4:#242424;
  --gold:#d4a843;--gold2:#f0c96a;--gold-dim:rgba(212,168,67,.15);
  --red:#e05252;--red-bg:rgba(224,82,82,.12);
  --orange:#e07d2a;--orange-bg:rgba(224,125,42,.12);
  --yellow:#d4c243;--yellow-bg:rgba(212,194,67,.12);
  --green:#4caf7d;--green-bg:rgba(76,175,125,.12);
  --gray:#9a9a9a;--border:rgba(255,255,255,.07);
  --text:#f0ece4;--muted:#666;--radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 18px 12px;position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.logo{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);letter-spacing:.5px;}
.logo span{display:block;font-family:'Outfit',sans-serif;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:2px;text-transform:uppercase;margin-top:1px;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:var(--bg3);border-radius:10px;padding:10px 10px 8px;border:1px solid var(--border);text-align:center;}
.stat .sv{font-size:14px;font-weight:700;line-height:1;}
.stat .sl{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:4px;opacity:.6;}
.stat.red .sv{color:var(--red);}
.stat.orange .sv{color:var(--orange);}
.stat.yellow .sv{color:var(--yellow);}
.stat.total .sv{color:var(--gold);}

/* VIEW TOGGLE */
.toggle-bar{display:flex;gap:8px;padding:12px 18px 0;}
.toggle-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px;}
.toggle-btn.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold);}

/* MAIN CONTENT */
.content{padding:14px 18px 80px;}

/* SECTION LABEL */
.section-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;padding-left:2px;}

/* FACTURA CARD — urgency view */
.fac-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.fac-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
.fac-card.red::before{background:var(--red);}
.fac-card.orange::before{background:var(--orange);}
.fac-card.yellow::before{background:var(--yellow);}
.fac-card.green::before{background:var(--green);}
.fac-card.gray::before{background:var(--muted);}
.fac-card:active{transform:scale(.99);}

.fac-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.fac-proveedor{font-size:14px;font-weight:700;color:var(--text);}
.fac-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.fac-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.5px;flex-shrink:0;white-space:nowrap;}
.fac-badge.red{background:var(--red-bg);color:var(--red);}
.fac-badge.orange{background:var(--orange-bg);color:var(--orange);}
.fac-badge.yellow{background:var(--yellow-bg);color:var(--yellow);}
.fac-badge.green{background:var(--green-bg);color:var(--green);}
.fac-badge.gray{background:rgba(150,150,150,.12);color:var(--gray);}

.fac-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.fac-num{background:var(--bg3);border-radius:8px;padding:7px 10px;}
.fac-num .nv{font-size:13px;font-weight:700;}
.fac-num .nl{font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}
.fac-num.saldo .nv{color:var(--red);}
.fac-num.abonado .nv{color:var(--green);}
.fac-num.dias .nv{font-size:15px;}
.fac-num.dias.red .nv{color:var(--red);}
.fac-num.dias.orange .nv{color:var(--orange);}
.fac-num.dias.yellow .nv{color:var(--yellow);}
.fac-num.dias.green .nv{color:var(--green);}
.fac-num.dias.gray .nv{color:var(--gray);}

/* PROVEEDOR CARD — supplier view */
.prov-card{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between;}
.prov-card:active{transform:scale(.99);}
.prov-info h3{font-size:14px;font-weight:700;}
.prov-info p{font-size:11px;color:var(--muted);margin-top:2px;}
.prov-right{text-align:right;}
.prov-deuda{font-size:16px;font-weight:700;color:var(--red);}
.prov-facturas{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}

/* DETAIL VIEW */
.view{display:none;}
.view.active{display:block;}

.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gold);cursor:pointer;padding:14px 18px 6px;letter-spacing:.3px;}

.detail-header{margin:0 18px 14px;background:var(--bg2);border-radius:var(--radius);padding:18px;border:1px solid var(--border);}
.detail-header h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);margin-bottom:10px;}
.detail-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ds{background:var(--bg3);border-radius:10px;padding:10px 12px;}
.ds .dv{font-size:15px;font-weight:700;}
.ds .dl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}
.ds.red .dv{color:var(--red);}
.ds.green .dv{color:var(--green);}

.detail-content{padding:0 18px 80px;}

/* FORMS */
.form-section{background:var(--bg2);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);}
.form-section h3{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
.form-section.abono h3{color:var(--green);}
.form-section.abono{border-color:rgba(76,175,125,.2);}
.form-section.nueva h3{color:var(--gold);}
.form-section.nueva{border-color:rgba(212,168,67,.2);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.fg input,.fg select{background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;font-family:'Outfit',sans-serif;color:var(--text);outline:none;width:100%;-webkit-appearance:none;}
.fg input:focus,.fg select:focus{border-color:var(--gold);}
.fg select option{background:var(--bg3);}

.btn{width:100%;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;margin-top:10px;letter-spacing:.5px;transition:all .2s;}
.btn:active{transform:scale(.98);}
.btn.green{background:var(--green);color:#fff;}
.btn.gold{background:var(--gold);color:#000;}
.btn.red{background:var(--red);color:#fff;}

/* FAC DETAIL in supplier view */
.fac-row{background:var(--bg2);border-radius:10px;padding:12px 14px;margin-bottom:6px;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.fac-row-left h4{font-size:13px;font-weight:600;}
.fac-row-left p{font-size:11px;color:var(--muted);margin-top:2px;}
.fac-row-right{text-align:right;flex-shrink:0;}
.fac-row-saldo{font-size:14px;font-weight:700;color:var(--red);}
.fac-row-dias{font-size:11px;margin-top:2px;}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:24px 20px 44px;width:100%;max-width:500px;border-top:1px solid var(--border);}
.modal h3{font-family:'Playfair Display',serif;font-size:19px;color:var(--gold);margin-bottom:6px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-btns button{padding:13px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:'Outfit',sans-serif;}
.m-cancel{background:var(--bg3);color:var(--text);}
.m-confirm{background:var(--red);color:white;}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);color:var(--text);padding:12px 24px;border-radius:30px;font-size:13px;font-weight:600;z-index:9999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 40px rgba(0,0,0,.5);border:1px solid var(--border);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.s{border-color:var(--green);color:var(--green);}
.toast.e{border-color:var(--red);color:var(--red);}

/* ADD BTN */
.add-btn{background:var(--bg2);color:var(--gold);border:1.5px dashed rgba(212,168,67,.3);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;text-align:center;font-size:13px;font-weight:600;letter-spacing:1px;}

@media(max-width:400px){.form-grid{grid-template-columns:1fr;}.fg.full{grid-column:1;}.stats-bar{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

<!-- MAIN VIEW -->
<div class="view active" id="vMain">
  <div class="header">
    <div class="header-top">
      <div class="logo">Mercantil Yumana<span>Control de Proveedores</span></div>
      <div style="font-size:11px;color:var(--muted);font-weight:500;" id="fechaHoy"></div>
    </div>
    <div class="stats-bar">
      <div class="stat red"><div class="sv" id="sVencido">$0</div><div class="sl">🔴 Vencido</div></div>
      <div class="stat orange"><div class="sv" id="sUrgente">$0</div><div class="sl">🟠 7 días</div></div>
      <div class="stat yellow"><div class="sv" id="sProximo">$0</div><div class="sl">🟡 15 días</div></div>
      <div class="stat total"><div class="sv" id="sTotal">$0</div><div class="sl">💰 Total</div></div>
    </div>
  </div>

  <div class="toggle-bar">
    <button class="toggle-btn active" id="btnVUrg" onclick="setView('urgencia')">⚡ Por Urgencia</button>
    <button class="toggle-btn" id="btnVProv" onclick="setView('proveedor')">🏢 Por Proveedor</button>
  </div>

  <div class="content">
    <div id="urgenciaView"></div>
    <div id="proveedorView" style="display:none"></div>
  </div>
</div>

<!-- FAC DETAIL VIEW -->
<div class="view" id="vFacDetail">
  <div class="back-btn" id="btnBackFac">← Volver</div>
  <div id="facDetailHeader"></div>
  <div class="detail-content">
    <div class="form-section abono">
      <h3>💰 Registrar Abono</h3>
      <div class="form-grid">
        <div class="fg"><label>Fecha</label><input type="date" id="aFecha"></div>
        <div class="fg"><label>Monto USD</label><input type="number" id="aMonto" placeholder="0.00" step="0.01" min="0"></div>
        <div class="fg full"><label>Método</label>
          <select id="aMetodo">
            <option value="">Seleccionar...</option>
            <option>Zelle</option><option>Efectivo USD</option><option>Transferencia</option><option>Bolívares</option>
          </select>
        </div>
      </div>
      <button class="btn green" id="btnDoAbono">✓ Registrar Abono</button>
    </div>
    <div id="facAbonosSection"></div>
    <div style="margin-top:20px;">
      <button class="btn red" id="btnDelFac" style="opacity:.7;">🗑 Eliminar esta Factura</button>
    </div>
  </div>
</div>

<!-- PROVEEDOR DETAIL VIEW -->
<div class="view" id="vProvDetail">
  <div class="back-btn" id="btnBackProv">← Volver</div>
  <div id="provDetailHeader"></div>
  <div class="detail-content" id="provDetailContent"></div>
</div>

<!-- NUEVA FACTURA VIEW -->
<div class="view" id="vNuevaFac">
  <div class="back-btn" id="btnBackNuevaFac">← Volver</div>
  <div style="padding:0 18px 80px;">
    <div class="form-section nueva" style="margin-top:14px;">
      <h3>📦 Nueva Factura</h3>
      <div class="form-grid">
        <div class="fg full"><label>Proveedor</label><input type="text" id="nfProv" placeholder="Ej: SALCAR"></div>
        <div class="fg"><label>Fecha Llegada</label><input type="date" id="nfLlegada"></div>
        <div class="fg"><label>Fecha Vencimiento</label><input type="date" id="nfVence"></div>
        <div class="fg"><label>Monto USD</label><input type="number" id="nfMonto" placeholder="0.00" step="0.01" min="0"></div>
        <div class="fg"><label>N° Factura (opcional)</label><input type="text" id="nfNum" placeholder="Ej: 001234"></div>
        <div class="fg full"><label>Descripción (opcional)</label><input type="text" id="nfDesc" placeholder="Ej: Aire split 24000 BTU x5"></div>
      </div>
      <button class="btn gold" id="btnDoNuevaFac">+ Agregar Factura</button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="overlay" id="delModal">
  <div class="modal">
    <h3>¿Eliminar factura?</h3>
    <p id="delModalMsg">Esta acción no se puede deshacer.</p>
    <div class="modal-btns">
      <button class="m-cancel" id="btnCancelDel">Cancelar</button>
      <button class="m-confirm" id="btnConfirmDel">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ── STATE ──
let D = [], curFacId = null, curProvId = null, curFromProv = false, delPending = null, currentMainView = 'urgencia';

// ── FIREBASE ──
async function load(){
  try{
    const snap = await getDoc(ref);
    if(snap.exists() && snap.data().proveedores) D = snap.data().proveedores;
    else { D = JSON.parse(JSON.stringify(INIT)); await save(); }
  } catch(e){
    try{ const s = localStorage.getItem('prov_v1'); D = s ? JSON.parse(s) : JSON.parse(JSON.stringify(INIT)); }
    catch(e2){ D = JSON.parse(JSON.stringify(INIT)); }
    toast('Sin conexión - datos locales','e');
  }
  init();
}

async function save(){
  try{ await setDoc(ref,{proveedores:D}); try{localStorage.setItem('prov_v1',JSON.stringify(D));}catch(e){} }
  catch(e){ try{localStorage.setItem('prov_v1',JSON.stringify(D));}catch(e2){} }
}

// ── UTILS ──
const fmt = n => '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().split('T')[0];
const gid = () => 'id_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);

function diasRestantes(vence){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const v = new Date(vence + 'T00:00:00');
  return Math.round((v - hoy) / 86400000);
}

function colorClass(dias){
  if(dias < 0) return 'red';
  if(dias <= 7) return 'orange';
  if(dias <= 15) return 'yellow';
  if(dias <= 30) return 'green';
  return 'gray';
}

function badgeText(dias){
  if(dias < 0) return `VENCIDA ${Math.abs(dias)}d`;
  if(dias === 0) return 'VENCE HOY';
  if(dias <= 7) return `URGENTE ${dias}d`;
  if(dias <= 15) return `PRÓXIMA ${dias}d`;
  if(dias <= 30) return `EN PLAZO ${dias}d`;
  return `OK ${dias}d`;
}

function fmtDate(d){ if(!d) return '—'; const p=d.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }

function toast(msg,t='s'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${t} show`;
  setTimeout(()=>el.className='toast',2800);
}

function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ── ALL FACTURAS FLAT ──
function allFacturas(){
  const arr = [];
  D.forEach(p => {
    p.facturas.forEach(f => {
      const saldo = f.monto - f.abonado;
      if(saldo > 0.005){
        arr.push({...f, proveedorId: p.id, proveedor: p.proveedor, saldo, dias: diasRestantes(f.vence)});
      }
    });
  });
  return arr.sort((a,b) => a.dias - b.dias);
}

// ── STATS ──
function updateStats(){
  const facs = allFacturas();
  const vencido = facs.filter(f=>f.dias<0).reduce((s,f)=>s+f.saldo,0);
  const urgente = facs.filter(f=>f.dias>=0&&f.dias<=7).reduce((s,f)=>s+f.saldo,0);
  const proximo = facs.filter(f=>f.dias>7&&f.dias<=15).reduce((s,f)=>s+f.saldo,0);
  const total = facs.reduce((s,f)=>s+f.saldo,0);
  document.getElementById('sVencido').textContent = vencido>0?fmt(vencido):'$0';
  document.getElementById('sUrgente').textContent = urgente>0?fmt(urgente):'$0';
  document.getElementById('sProximo').textContent = proximo>0?fmt(proximo):'$0';
  document.getElementById('sTotal').textContent = fmt(total);
}

  let html = '';
  ['red','orange','yellow','green','gray'].forEach(color => {

    html += `<div class="section-label">${labels[color]}</div>`;

      html += `<div class="fac-card ${color}" data-facid="${f.id}" data-provid="${f.proveedorId}">

function renderProveedores(){
  const provs = D.map(p => {
    const totalDeuda = p.facturas.reduce((s,f)=>s+(f.monto-f.abonado>0?f.monto-f.abonado:0),0);

    const minDias = facsPend.length ? Math.min(...facsPend.map(f=>diasRestantes(f.vence))) : 999;
    return {...p, totalDeuda, facsPend: facsPend.length, minDias};
  }).filter(p=>p.totalDeuda>0).sort((a,b)=>a.minDias-b.minDias);

  let html = '';

    const color = colorClass(p.minDias);

      <div class="prov-info">
        <h3>${p.proveedor}</h3>
        <p>${p.facsPend} factura${p.facsPend!==1?'s':''} pendiente${p.facsPend!==1?'s':''} · ${p.minDias<0?'VENCIDA':p.minDias+'d próx.'}</p>

// ── ACTIONS ──
function doAbono(){
  const fecha = document.getElementById('aFecha').value;
  const monto = parseFloat(document.getElementById('aMonto').value);
  const metodo = document.getElementById('aMetodo').value;
  if(!fecha){ toast('Ingresa la fecha','e'); return; }
  if(!monto||monto<=0){ toast('Ingresa un monto válido','e'); return; }
  if(!metodo){ toast('Selecciona el método','e'); return; }

  const p = D.find(x=>x.id===curProvId);
  const f = p.facturas.find(x=>x.id===curFacId);
  const saldo = f.monto - f.abonado;
  if(monto > saldo + 0.01){ toast(`El abono supera el saldo (${fmt(saldo)})`,'e'); return; }

  f.abonado = +(f.abonado + monto).toFixed(2);
  if(!f.abonos) f.abonos = [];
  f.abonos.push({id:gid(), fecha, monto, metodo});

  save();
  toast(`✓ Abono de ${fmt(monto)} registrado`,'s');
  document.getElementById('aMonto').value='';
  document.getElementById('aMetodo').value='';

  // refresh header
  const saldoNew = f.monto - f.abonado;
  const dias = diasRestantes(f.vence);
  const color = colorClass(dias);
  const colorMap = {red:'var(--red)',orange:'var(--orange)',yellow:'var(--yellow)',green:'var(--green)',gray:'var(--muted)'};
  document.getElementById('facDetailHeader').querySelector('.ds.red .dv').textContent = fmt(saldoNew);
  document.getElementById('facDetailHeader').querySelector('.ds.green .dv').textContent = fmt(f.abonado);
  renderAbonosSection(f);
  updateStats();
  renderUrgencia();
  renderProveedores();
}

function doNuevaFac(){
  const provNombre = document.getElementById('nfProv').value.trim().toUpperCase();
  const llegada = document.getElementById('nfLlegada').value;
  const vence = document.getElementById('nfVence').value;
  const monto = parseFloat(document.getElementById('nfMonto').value);
  const num = document.getElementById('nfNum').value.trim();
  const desc = document.getElementById('nfDesc').value.trim();

  if(!provNombre){ toast('Ingresa el proveedor','e'); return; }
  if(!vence){ toast('Ingresa la fecha de vencimiento','e'); return; }
  if(!monto||monto<=0){ toast('Ingresa un monto válido','e'); return; }

  let p = D.find(x=>x.proveedor===provNombre);
  if(!p){
    p = {id:'p_'+Date.now(), proveedor:provNombre, facturas:[]};
    D.push(p);
  }
  p.facturas.push({id:gid(), llegada, vence, monto, abonado:0, num, desc, abonos:[]});
  save();
  toast(`✓ Factura de ${fmt(monto)} agregada a ${provNombre}`,'s');
  updateStats();
  renderUrgencia();
  renderProveedores();
  showView('vMain');
}

function askDelFac(){
  const p = D.find(x=>x.id===curProvId);
  const f = p.facturas.find(x=>x.id===curFacId);
  document.getElementById('delModalMsg').textContent = `Se eliminará la factura de ${p.proveedor} por ${fmt(f.monto)}. Esta acción no se puede deshacer.`;
  delPending = {provId:curProvId, facId:curFacId};
  document.getElementById('delModal').classList.add('show');
}

function confirmDel(){
  const p = D.find(x=>x.id===delPending.provId);
  p.facturas = p.facturas.filter(x=>x.id!==delPending.facId);
  save();
  toast('Factura eliminada','s');
  document.getElementById('delModal').classList.remove('show');
  updateStats();
  renderUrgencia();
  renderProveedores();
  if(curFromProv) goProvDetail(delPending.provId);
  else showView('vMain');
  delPending = null;
}
