<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zona de Prueba — Entregas — PRUEBA</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0b12; --bg-grad1:#12121e; --bg-grad2:#0a0a10;
    --surface:#15151f; --surface-2:#1d1d2b; --surface-3:#22222f;
    --border:#2c2c40; --border-soft:#232331; --gold:#c9a24c; --gold-bright:#e8cd83; --gold-dim:#8c7536;
    --text:#ece6d8; --text-2:#b8b2a6; --muted:#6f6f82;
    --green:#2ec27a; --green-soft:#7fe6a8; --red:#e85d4c; --orange:#f0a838; --blue:#4ba3e0;
    --shadow:0 8px 32px rgba(0,0,0,0.45); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
    --glow:0 0 0 1px rgba(201,162,76,0.15), 0 4px 24px rgba(201,162,76,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-grad1), transparent),radial-gradient(ellipse 70% 50% at 100% 100%, var(--bg-grad2), transparent);
    background-attachment:fixed; color:var(--text); font-family:'Outfit',sans-serif;
    min-height:100vh; padding:20px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .banner{background:rgba(240,168,56,0.12); border:1px solid #f0a83855; border-radius:12px; padding:10px 14px; margin-bottom:18px; font-size:12.5px; color:#f0a838;}
  h1{font-family:'Fraunces',serif; font-size:24px; color:var(--gold); margin-bottom:4px;}
  .sub{color:var(--text-2); font-size:13px; margin-bottom:22px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  label{display:block; font-size:11px; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px; font-family:inherit; outline:none;}
  input:focus{box-shadow:var(--glow); border-color:var(--gold-dim);}
  .row{display:flex; gap:10px;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:#0b0b12; border:none; border-radius:11px; padding:14px; font-size:14px; font-weight:700; cursor:pointer; width:100%; font-family:inherit; transition:transform .15s;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-buscar{flex:0 0 auto; width:auto; padding:12px 22px;}
  .btn-green{background:linear-gradient(135deg,var(--green),#1f9d5e); color:#fff;}
  .btn-orange{background:linear-gradient(135deg,var(--orange),#c8881e); color:#0b0b12;}
  .btn-ghost{background:var(--surface-3); color:var(--gold); border:1px solid var(--gold-dim);}
  .venta-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border);}
  .venta-head .num{font-family:'Fraunces',serif; font-size:20px; color:var(--gold);}
  .venta-head .meta{font-size:12px; color:var(--text-2); margin-top:3px;}
  .estado-badge{font-size:11px; font-weight:700; padding:4px 12px; border-radius:8px; text-transform:uppercase;}
  .e-vendido{background:rgba(75,163,224,0.15); color:var(--blue);}
  .e-pendiente{background:rgba(240,168,56,0.15); color:var(--orange);}
  .e-entregado{background:rgba(46,194,122,0.15); color:var(--green-soft);}
  .prod{display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:16px 0; border-bottom:1px solid var(--border-soft);}
  .prod:last-child{border-bottom:none;}
  .prod-sel{cursor:pointer; padding-left:6px;}
  .prod-sel input[type=checkbox]{width:26px; height:26px; accent-color:var(--gold); cursor:pointer; flex-shrink:0;}
  .prod-done{opacity:0.55;}
  .prod-done .prod-desc{text-decoration:line-through;}
  .done-tag{color:var(--green-soft)!important; font-weight:700; display:inline-flex; align-items:center; gap:4px;}
  .prod .prod-cod{font-size:22px; font-weight:800; letter-spacing:0.5px; background:var(--blue); color:#fff; padding:6px 12px; border-radius:8px; white-space:nowrap;}
  .prod .prod-desc{font-size:21px; font-weight:700; line-height:1.3; flex:1; min-width:180px;}
  .prod .q{color:var(--text-2); font-size:16px; font-weight:600; white-space:nowrap;}
  .total-row{display:flex; justify-content:space-between; padding-top:12px; margin-top:6px; border-top:1px solid var(--border);}
  .total-row .amt{font-family:'Fraunces',serif; font-size:20px; color:var(--green-soft); font-weight:700;}
  .acciones{display:flex; gap:10px; margin-top:16px;}
  .acciones .btn{flex:1;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 18px;}
  #toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--gold-dim); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; box-shadow:var(--shadow); display:none; z-index:200; max-width:90%;}
  .hidden{display:none !important;}
  .login-screen{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; z-index:500;}
  .login-card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:30px 24px; width:100%; max-width:360px; box-shadow:var(--shadow);}
  .login-brand{font-family:'Fraunces',serif; font-size:22px; color:var(--gold); text-align:center; font-weight:700;}
  .login-tag{text-align:center; color:var(--text-2); font-size:13px; margin:4px 0 22px;}
  .login-error{color:var(--red); font-size:12.5px; margin-top:10px; display:none;}
  .login-error.show{display:block;}
  .user-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .user-info{display:flex; flex-direction:column;}
  .user-info span:first-child{font-weight:600; font-size:14px;}
  .user-role{font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .btn-logout{background:var(--surface-3); color:var(--text-2); border:1px solid var(--border); border-radius:8px; padding:8px 16px; font-size:12px; cursor:pointer; font-family:inherit;}
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px; color:var(--text-2); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;}
  .tab.active{background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:#0b0b12; border-color:var(--gold-dim);}
  .pend-item{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px;}
  .pend-item .pend-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .pend-item .pend-num{font-weight:700; font-size:14px; color:var(--gold);}
  .pend-item .pend-cli{font-size:12px; color:var(--text-2); margin-top:2px;}
  .pend-item .pend-prods{font-size:12px; color:var(--text); margin-top:6px; line-height:1.5;}
  .pend-item .pend-fecha{font-size:10.5px; color:var(--muted); margin-top:4px;}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">MERCANTIL YUMANA</div>
    <div class="login-tag">Zona de Prueba — Entregas</div>
    <label>Email</label>
    <input type="email" id="email" autocomplete="username" placeholder="correo@ejemplo.com">
    <label style="margin-top:12px;">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    <div class="login-error" id="loginError"></div>
    <button class="btn" id="btnLogin" style="margin-top:16px;">Entrar</button>
  </div>
</div>

<div class="wrap hidden" id="appWrap">
  <div class="user-bar" id="userBar">
    <div class="user-info"><span id="userName"></span><span class="user-role" id="userRole"></span></div>
    <button class="btn-logout" id="btnLogout">Salir</button>
  </div>
  <div class="banner">⚠ MODO PRUEBA — Zona de entrega. Marca ventas como entregadas/pendientes en la base de datos real.</div>
  <h1>Zona de Prueba — Entregas</h1>
  <div class="sub">Verifica el producto, genera la nota para firma del cliente, y confirma la entrega</div>

  <div class="tabs">
    <button class="tab active" id="tabEntregas">Entregas</button>
    <button class="tab" id="tabPendientes">Pendientes por entregar</button>
  </div>

  <div id="vistaEntregas">
    <div class="card">
      <label>Buscar venta</label>
      <div class="row">
        <input type="text" id="numVenta" placeholder="N° venta, factura VALERY, nombre o teléfono" autocomplete="off">
        <button class="btn btn-buscar" id="btnBuscar">Buscar</button>
      </div>
      <button class="btn btn-ghost" id="btnSoloGarantia" style="margin-top:12px;">Imprimir solo condiciones de garantía</button>
    </div>
    <div id="resultado"></div>
  </div>

  <div id="vistaPendientes" class="hidden">
    <div class="card">
      <div class="row" style="align-items:center;">
        <label style="margin:0;flex:1;">Lo que falta entregar</label>
        <button class="btn-logout" id="btnRefrescarPend">Actualizar</button>
      </div>
      <input type="text" id="buscarPend" placeholder="Buscar por nombre, factura VALERY, N° venta o teléfono..." autocomplete="off" style="margin-top:12px;">
      <div id="listaPendientes" style="margin-top:12px;"><div class="empty">Cargando...</div></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL='https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY='sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null, currentUserApp=null;
let ES_ADMIN=false;

async function checkSession(){
  try{
    var result = await sb.auth.getSession();
    var session = result.data && result.data.session;
    if(session){ await onLogin(session.user); }
  }catch(e){}
}

document.getElementById('btnLogin').addEventListener('click', async function(){
  var btn=this;
  var email=document.getElementById('email').value.trim().toLowerCase();
  var password=document.getElementById('password').value;
  if(!email||!password){
    document.getElementById('loginError').textContent='Llena los dos campos';
    document.getElementById('loginError').classList.add('show'); return;
  }
  document.getElementById('loginError').classList.remove('show');
  btn.disabled=true; btn.textContent='Entrando...';
  try{
    var result=await sb.auth.signInWithPassword({email:email, password:password});
    if(result.error) throw result.error;
    await onLogin(result.data.user);
  }catch(e){
    document.getElementById('loginError').textContent='Email o contraseña incorrectos';
    document.getElementById('loginError').classList.add('show');
    btn.disabled=false; btn.textContent='Entrar';
  }
});

async function onLogin(user){
  currentUser=user;
  try{
    var result=await sb.from('usuarios_app').select('*').eq('id', user.id).single();
    if(result.error) throw result.error;
    currentUserApp=result.data;
    ES_ADMIN = (currentUserApp.rol==='admin');
    document.getElementById('userName').textContent=currentUserApp.nombre;
    document.getElementById('userRole').textContent=currentUserApp.rol;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appWrap').classList.remove('hidden');
  }catch(e){
    document.getElementById('loginError').textContent='Error cargando perfil: '+e.message;
    document.getElementById('loginError').classList.add('show');
  }
}

document.getElementById('btnLogout').addEventListener('click', async function(){
  await sb.auth.signOut();
  location.reload();
});

let VENTA_ACTUAL=null;
let ITEMS_ACTUAL=[];

function toast(msg, ms){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(function(){t.style.display='none';}, ms||2800); }

// Íconos SVG inline: se ven idénticos en Windows/Mac/Linux (no dependen de emojis del sistema)
function ico(nombre, tam){
  var s = tam||16;
  var P = '<svg xmlns="http://www.w3.org/2000/svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;display:inline-block;">';
  var paths = {
    tel: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
    factura: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
    caja: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    impresora: '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    camion: '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
    alerta: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'
  };
  return P + (paths[nombre]||'') + '</svg>';
}
function nombreEstado(e){
  if(e==='vendido') return 'Vendido';
  if(e==='pendiente_retirar') return 'Pendiente por retirar';
  if(e==='entregado') return 'Entregado';
  if(e==='delivery') return 'En delivery';
  if(e==='anulado') return 'Anulado';
  return e;
}
function claseEstado(e){
  if(e==='entregado') return 'e-entregado';
  if(e==='delivery') return 'e-entregado';
  if(e==='pendiente_retirar') return 'e-pendiente';
  return 'e-vendido';
}

let ULTIMA_LISTA=[];

async function buscarVenta(){
  var texto = document.getElementById('numVenta').value.trim();
  var cont = document.getElementById('resultado');
  if(!texto){ cont.innerHTML=''; return; }
  cont.innerHTML = '<div class="card"><div class="empty">Buscando...</div></div>';
  try{
    var encontrada = null;

    // 1) Si son solo dígitos, intenta por número de venta y por factura VALERY
    if(/^\d+$/.test(texto)){
      var porNum = await sb.from('inv_ventas').select('*').eq('numero', parseInt(texto,10)).maybeSingle();
      if(porNum.data) encontrada = porNum.data;
      if(!encontrada){
        var porValery = await sb.from('inv_ventas').select('*').eq('valery_ref', texto).order('fecha',{ascending:false}).limit(1).maybeSingle();
        if(porValery.data) encontrada = porValery.data;
      }
    }

    // 2) Busca por nombre, teléfono o valery (puede dar varias)
    var like = '%'+texto+'%';
    var porNombre = await sb.from('inv_ventas')
      .select('*')
      .or('cliente_nombre.ilike.'+like+',cliente_telefono.ilike.'+like+',valery_ref.ilike.'+like)
      .order('estado',{ascending:true})
      .order('fecha',{ascending:false})
      .limit(30);
    var lista = porNombre.data || [];

    // Combinar: si encontró por número exacto, ponerla primero
    if(encontrada && !lista.find(function(v){return v.id===encontrada.id;})){
      lista.unshift(encontrada);
    }

    if(lista.length===0){
      cont.innerHTML='<div class="card"><div class="empty">No se encontró ninguna venta con "'+texto.replace(/</g,'&lt;')+'"</div></div>'; return;
    }
    if(lista.length===1){ ULTIMA_LISTA=lista; await abrirVenta(lista[0], true); }
    else { mostrarListaResultados(lista); }
  }catch(e){ cont.innerHTML='<div class="card"><div class="empty">Error: '+e.message+'</div></div>'; }
}

function mostrarListaResultados(lista){
  ULTIMA_LISTA = lista;
  var cont = document.getElementById('resultado');
  cont.innerHTML = '<div class="card">'+
    '<label>Se encontraron '+lista.length+' ventas · toca la correcta</label>'+
    lista.map(function(v){
      var fecha = new Date(v.fecha).toLocaleDateString('es-VE');
      var badge = '<span class="estado-badge '+claseEstado(v.estado)+'">'+nombreEstado(v.estado)+'</span>';
      var valery = v.valery_ref ? ' · Fact '+v.valery_ref : '';
      return '<div class="pend-item" data-vid="'+v.id+'" style="cursor:pointer;">'+
        '<div class="pend-head">'+
          '<div><div class="pend-num">Venta #'+v.numero+valery+'</div>'+
          '<div class="pend-cli">'+(v.cliente_nombre||'Sin cliente')+' · '+fecha+'</div></div>'+
          badge+
        '</div>'+
      '</div>';
    }).join('')+
  '</div>';
  cont.querySelectorAll('[data-vid]').forEach(function(el){
    el.addEventListener('click', async function(){
      var vid = parseInt(this.dataset.vid,10);
      var v = lista.find(function(x){ return x.id===vid; });
      if(v) await abrirVenta(v, false);
    });
  });
}

async function abrirVenta(venta, vinoDirecto){
  VENTA_ACTUAL = venta;
  var ri = await sb.from('inv_venta_items').select('*, inv_productos(codigo_valery)').eq('venta_id', venta.id);
  ITEMS_ACTUAL = (ri.data || []).map(function(it){
    it.codigo_valery = (it.inv_productos && it.inv_productos.codigo_valery) ? it.inv_productos.codigo_valery : '';
    it.por_entregar = false;
    return it;
  });
  renderVenta(vinoDirecto);
}

function renderVenta(vinoDirecto){
  var v = VENTA_ACTUAL;
  var fecha = new Date(v.fecha).toLocaleDateString('es-VE') + ' ' + new Date(v.fecha).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
  // Contar items pendientes vs entregados
  var pendientes = ITEMS_ACTUAL.filter(function(it){ return it.estado_item!=='entregado'; });
  var entregados = ITEMS_ACTUAL.filter(function(it){ return it.estado_item==='entregado'; });
  var todoEntregado = (pendientes.length===0 && ITEMS_ACTUAL.length>0);
  var prodsHtml = ITEMS_ACTUAL.map(function(it, idx){
    var cod = (it.codigo_valery||'').replace(/</g,'&lt;');
    var codHtml = cod ? '<span class="prod-cod">'+cod+'</span>' : '';
    var precioHtml = ES_ADMIN
      ? '<span class="q">'+it.cantidad+' \u00d7 $'+Number(it.precio_unitario).toFixed(2)+'</span>'
      : '<span class="q">Cant: '+it.cantidad+'</span>';
    var desc = '<span class="prod-desc">'+(it.descripcion||'').replace(/</g,'&lt;')+'</span>';
    if(it.estado_item==='entregado'){
      // Ya entregado: gris, con fecha, no seleccionable
      var fEnt = it.fecha_entrega ? new Date(it.fecha_entrega).toLocaleDateString('es-VE') : '';
      return '<div class="prod prod-done">'+codHtml+desc+
        '<span class="q done-tag">'+ico('check',14)+' Entregado'+(fEnt?' '+fEnt:'')+'</span></div>';
    }
    // Pendiente: casilla seleccionable
    var checked = it.por_entregar ? 'checked' : '';
    return '<label class="prod prod-sel"><input type="checkbox" class="chk-item" data-idx="'+idx+'" '+checked+'>'+
      codHtml+desc+precioHtml+'</label>';
  }).join('');
  var yaEntregado = todoEntregado;
  var volverHtml = (!vinoDirecto && ULTIMA_LISTA.length>1)
    ? '<button class="btn-logout" id="btnVolverLista" style="margin-bottom:12px;">← Volver a la lista</button>'
    : '';

  var accionesHtml;
  if(yaEntregado){
    accionesHtml = '<div style="text-align:center;color:var(--green-soft);font-size:14px;padding:10px;font-weight:700;">'+ico('check',16)+' Esta venta fue ENTREGADA por completo</div>';
    if(ES_ADMIN){
      accionesHtml += '<button class="btn" id="btnRevertir" style="background:rgba(232,93,76,0.15);color:var(--red);border:1px solid var(--red);">Revertir entrega (solo admin)</button>';
    } else {
      accionesHtml += '<div style="text-align:center;font-size:11px;color:var(--muted);padding-bottom:6px;">Para revertir se requiere autorizaci\u00f3n de administrador</div>';
    }
  } else {
    var hayEntregados = entregados.length>0;
    var avisoParcial = hayEntregados
      ? '<div style="font-size:12px;color:var(--gold);text-align:center;margin-bottom:10px;">Esta venta tiene entregas parciales. Marca lo que el cliente retira HOY.</div>'

// Devuelve los items marcados para entregar hoy
function itemsSeleccionados(){
  return ITEMS_ACTUAL.filter(function(it){ return it.estado_item!=='entregado' && it.por_entregar; });
}
function haySeleccion(){ return itemsSeleccionados().length>0; }

async function revertirEntrega(){
  if(!VENTA_ACTUAL || !ES_ADMIN) return;
  try{
    var r = await sb.from('inv_ventas').update({ estado:'vendido' }).eq('id', VENTA_ACTUAL.id);
    if(r.error) throw r.error;
    await sb.from('inv_venta_items').update({ estado_item:'vendido', fecha_entrega:null }).eq('venta_id', VENTA_ACTUAL.id);
    VENTA_ACTUAL.estado='vendido';
    ITEMS_ACTUAL.forEach(function(it){ it.estado_item='vendido'; it.fecha_entrega=null; it.por_entregar=false; });
    renderVenta(true);
    toast('Entrega revertida · Venta #'+VENTA_ACTUAL.numero+' vuelve a estado vendido', 3500);
  }catch(e){ toast('Error: '+e.message, 4000); }
}

function mostrarFormDelivery(){
  document.getElementById('deliveryBox').innerHTML =
    '<div class="card">'+
      '<label>Dirección de entrega</label>'+
      '<input type="text" id="delDir" placeholder="Dirección completa del cliente">'+
      '<div style="margin-top:12px;"><label>Teléfono de contacto</label>'+
      '<input type="tel" id="delTel" placeholder="Para que el repartidor pueda llamar"></div>'+
      '<button class="btn" id="btnConfirmDelivery" style="margin-top:14px;background:linear-gradient(135deg,var(--blue),#2f7fc0);color:#fff;">Confirmar salida por delivery</button>'+
    '</div>';
  document.getElementById('btnConfirmDelivery').addEventListener('click', function(){
    var dir = document.getElementById('delDir').value.trim();
    var tel = document.getElementById('delTel').value.trim();
    if(!dir){ toast('Escribe la dirección de entrega'); return; }
    confirmarEntrega('delivery', dir, tel);
  });
  document.getElementById('deliveryBox').scrollIntoView({behavior:'smooth', block:'center'});
}

async function confirmarEntrega(nuevoEstado, direccion, telefono){
  if(!VENTA_ACTUAL) return;
  var sel = itemsSeleccionados();
  if(sel.length===0){ toast('Marca al menos un producto'); return; }
  try{
    var ahoraISO = new Date().toISOString();
    // 1) Marcar SOLO los items seleccionados como entregados, con su fecha
    var idsSel = sel.map(function(it){ return it.id; });
    var updItem = { estado_item:'entregado', fecha_entrega:ahoraISO };
    if(nuevoEstado==='delivery' && direccion){
      updItem.nota_entrega = 'DELIVERY a: '+direccion+(telefono?' · Tel: '+telefono:'');
    }
    var ru = await sb.from('inv_venta_items').update(updItem).in('id', idsSel);
    if(ru.error) throw ru.error;
    // Reflejar en memoria
    sel.forEach(function(it){ it.estado_item='entregado'; it.fecha_entrega=ahoraISO; it.por_entregar=false; });
    // 2) Calcular estado de la VENTA: si quedan pendientes -> parcial; si no -> entregado/delivery
    var quedanPendientes = ITEMS_ACTUAL.some(function(it){ return it.estado_item!=='entregado'; });
    var estadoVenta = quedanPendientes ? 'pendiente_retirar' : (nuevoEstado==='delivery'?'delivery':'entregado');
    var datos = { estado: estadoVenta };
    if(nuevoEstado==='delivery'){
      datos.notas = (VENTA_ACTUAL.notas?VENTA_ACTUAL.notas+' | ':'') + 'DELIVERY a: '+direccion+(telefono?' · Tel: '+telefono:'');
    }
    var r = await sb.from('inv_ventas').update(datos).eq('id', VENTA_ACTUAL.id);
    if(r.error) throw r.error;
    VENTA_ACTUAL.estado = estadoVenta;
    if(datos.notas) VENTA_ACTUAL.notas = datos.notas;
    var dbox = document.getElementById('deliveryBox'); if(dbox) dbox.innerHTML='';
    renderVenta(true);
    var msg = quedanPendientes
      ? 'Entregados '+sel.length+' producto(s). Quedan pendientes los dem\u00e1s.'
      : (nuevoEstado==='delivery' ? 'Venta #'+VENTA_ACTUAL.numero+' sali\u00f3 por DELIVERY (completa)'
                                  : 'Venta #'+VENTA_ACTUAL.numero+' ENTREGADA por completo');
    toast(msg, 3500);
  }catch(e){ toast('Error: '+e.message, 4000); }
}

  document.getElementById('tabEntregas').classList.remove('active');
  document.getElementById('vistaPendientes').classList.remove('hidden');
  document.getElementById('vistaEntregas').classList.add('hidden');
  cargarPendientes();
});
document.getElementById('btnRefrescarPend').addEventListener('click', cargarPendientes);

let PENDIENTES_CACHE=[];
let ITEMS_PEND_CACHE={};

async function cargarPendientes(){
  var cont = document.getElementById('listaPendientes');
  cont.innerHTML = '<div class="empty">Cargando...</div>';
  try{
    var rv = await sb.from('inv_ventas')
      .select('*')
      .in('estado', ['vendido','pendiente_retirar','delivery'])
      .order('fecha', {ascending:true});
    var ventas = rv.data || [];
    if(ventas.length===0){ PENDIENTES_CACHE=[]; cont.innerHTML='<div class="empty">No hay nada pendiente por entregar</div>'; return; }

    var ids = ventas.map(function(v){ return v.id; });
    var ri = await sb.from('inv_venta_items').select('venta_id, descripcion, cantidad').in('venta_id', ids);
    ITEMS_PEND_CACHE = {};
    (ri.data||[]).forEach(function(it){
      if(!ITEMS_PEND_CACHE[it.venta_id]) ITEMS_PEND_CACHE[it.venta_id]=[];
      ITEMS_PEND_CACHE[it.venta_id].push(it);
    });
    PENDIENTES_CACHE = ventas;
    renderPendientes(ventas);
  }catch(e){ cont.innerHTML='<div class="empty">Error: '+e.message+'</div>'; }
}

function diasEsperando(fecha){
  var ms = Date.now() - new Date(fecha).getTime();
  var dias = Math.floor(ms / (1000*60*60*24));
  return dias;
}

function renderPendientes(ventas){
  var cont = document.getElementById('listaPendientes');
  if(ventas.length===0){ cont.innerHTML='<div class="empty">Sin resultados para esa búsqueda</div>'; return; }
  cont.innerHTML = ventas.map(function(v){
    var prods = (ITEMS_PEND_CACHE[v.id]||[]).map(function(it){
      return (it.cantidad>1?it.cantidad+'x ':'')+(it.descripcion||'');
    }).join(', ');
    var fecha = new Date(v.fecha).toLocaleDateString('es-VE')+' '+new Date(v.fecha).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
    var dias = diasEsperando(v.fecha);
    var diasTxt = dias===0 ? 'hoy' : (dias===1 ? 'hace 1 día' : 'hace '+dias+' días');
    var diasColor = dias>=7 ? 'color:var(--red);font-weight:700;' : (dias>=3 ? 'color:var(--orange);' : 'color:var(--muted);');
    var badge = '<span class="estado-badge '+claseEstado(v.estado)+'">'+nombreEstado(v.estado)+'</span>';
    var valery = v.valery_ref ? ' · Factura '+v.valery_ref : '';
    var tel = v.cliente_telefono ? ' · Tel: '+v.cliente_telefono : '';
    var quien = v.registrado_por ? 'Registró: '+v.registrado_por : '';
    return '<div class="pend-item">'+
      '<div class="pend-head">'+
        '<div><div class="pend-num">Venta #'+v.numero+valery+'</div>'+
        '<div class="pend-cli">'+(v.cliente_nombre||'Sin cliente')+tel+'</div></div>'+
        badge+
      '</div>'+
      '<div class="pend-prods">'+prods+'</div>'+
      '<div class="pend-fecha">'+fecha+' · $'+Number(v.total).toFixed(2)+' · <span style="'+diasColor+'">'+diasTxt+'</span>'+(quien?' · '+quien:'')+'</div>'+
    '</div>';
  }).join('');
}

document.getElementById('buscarPend').addEventListener('input', function(){
  var q = this.value.toLowerCase().trim();
  if(!q){ renderPendientes(PENDIENTES_CACHE); return; }
  var filtradas = PENDIENTES_CACHE.filter(function(v){
    var texto = ((v.cliente_nombre||'')+' '+(v.valery_ref||'')+' '+(v.numero||'')+' '+(v.cliente_telefono||'')).toLowerCase();
    return texto.indexOf(q)>=0;
  });
  renderPendientes(filtradas);
});

checkSession();
