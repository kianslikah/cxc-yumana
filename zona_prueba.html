<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zona de Prueba — Entregas — PRUEBA</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0b12; --bg-grad1:#12121e; --bg-grad2:#0a0a10;
    --surface:#15151f; --surface-2:#1d1d2b; --surface-3:#22222f;
    --border:#2c2c40; --border-soft:#232331; --gold:#c9a24c; --gold-bright:#e8cd83; --gold-dim:#8c7536;
    --text:#ece6d8; --text-2:#b8b2a6; --muted:#6f6f82;
    --green:#2ec27a; --green-soft:#7fe6a8; --red:#e85d4c; --orange:#f0a838; --blue:#4ba3e0;
    --shadow:0 8px 32px rgba(0,0,0,0.45); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
    --glow:0 0 0 1px rgba(201,162,76,0.15), 0 4px 24px rgba(201,162,76,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-grad1), transparent),radial-gradient(ellipse 70% 50% at 100% 100%, var(--bg-grad2), transparent);
    background-attachment:fixed; color:var(--text); font-family:'Outfit',sans-serif;
    min-height:100vh; padding:20px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .banner{background:rgba(240,168,56,0.12); border:1px solid #f0a83855; border-radius:12px; padding:10px 14px; margin-bottom:18px; font-size:12.5px; color:#f0a838;}
  h1{font-family:'Fraunces',serif; font-size:24px; color:var(--gold); margin-bottom:4px;}
  .sub{color:var(--text-2); font-size:13px; margin-bottom:22px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  label{display:block; font-size:11px; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px; font-family:inherit; outline:none;}
  input:focus{box-shadow:var(--glow); border-color:var(--gold-dim);}
  .row{display:flex; gap:10px;}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:#0b0b12; border:none; border-radius:11px; padding:14px; font-size:14px; font-weight:700; cursor:pointer; width:100%; font-family:inherit; transition:transform .15s;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-buscar{flex:0 0 auto; width:auto; padding:12px 22px;}
  .btn-green{background:linear-gradient(135deg,var(--green),#1f9d5e); color:#fff;}
  .btn-orange{background:linear-gradient(135deg,var(--orange),#c8881e); color:#0b0b12;}
  .btn-ghost{background:var(--surface-3); color:var(--gold); border:1px solid var(--gold-dim);}
  .venta-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border);}
  .venta-head .num{font-family:'Fraunces',serif; font-size:20px; color:var(--gold);}
  .venta-head .meta{font-size:12px; color:var(--text-2); margin-top:3px;}
  .estado-badge{font-size:11px; font-weight:700; padding:4px 12px; border-radius:8px; text-transform:uppercase;}
  .e-vendido{background:rgba(75,163,224,0.15); color:var(--blue);}
  .e-pendiente{background:rgba(240,168,56,0.15); color:var(--orange);}
  .e-entregado{background:rgba(46,194,122,0.15); color:var(--green-soft);}
  .prod{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border-soft); font-size:13.5px;}
  .prod:last-child{border-bottom:none;}
  .prod .q{color:var(--text-2);}
  .total-row{display:flex; justify-content:space-between; padding-top:12px; margin-top:6px; border-top:1px solid var(--border);}
  .total-row .amt{font-family:'Fraunces',serif; font-size:20px; color:var(--green-soft); font-weight:700;}
  .acciones{display:flex; gap:10px; margin-top:16px;}
  .acciones .btn{flex:1;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 18px;}
  #toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--gold-dim); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; box-shadow:var(--shadow); display:none; z-index:200; max-width:90%;}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">⚠ MODO PRUEBA — Zona de entrega. Marca ventas como entregadas/pendientes en la base de datos real.</div>
  <h1>Zona de Prueba — Entregas</h1>
  <div class="sub">Verifica el producto, genera la nota para firma del cliente, y confirma la entrega</div>

  <div class="card">
    <label>Buscar venta por número</label>
    <div class="row">
      <input type="number" id="numVenta" placeholder="Ej: 47" autocomplete="off">
      <button class="btn btn-buscar" id="btnBuscar">Buscar</button>
    </div>
    <button class="btn btn-ghost" id="btnSoloGarantia" style="margin-top:12px;">Imprimir solo condiciones de garantía</button>
  </div>

  <div id="resultado"></div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL='https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY='sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let VENTA_ACTUAL=null;
let ITEMS_ACTUAL=[];

function toast(msg, ms){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(function(){t.style.display='none';}, ms||2800); }

function nombreEstado(e){
  if(e==='vendido') return 'Vendido';
  if(e==='pendiente_retirar') return 'Pendiente por retirar';
  if(e==='entregado') return 'Entregado';
  if(e==='delivery') return 'En delivery';
  if(e==='anulado') return 'Anulado';
  return e;
}
function claseEstado(e){
  if(e==='entregado') return 'e-entregado';
  if(e==='delivery') return 'e-entregado';
  if(e==='pendiente_retirar') return 'e-pendiente';
  return 'e-vendido';
}

async function buscarVenta(){
  var num = parseInt(document.getElementById('numVenta').value,10);
  if(!num){ toast('Escribe un número de venta'); return; }
  var cont = document.getElementById('resultado');
  cont.innerHTML = '<div class="card"><div class="empty">Buscando...</div></div>';
  try{
    var rv = await sb.from('inv_ventas').select('*').eq('numero', num).maybeSingle();
    if(!rv.data){ cont.innerHTML='<div class="card"><div class="empty">No se encontró la venta #'+num+'</div></div>'; return; }
    VENTA_ACTUAL = rv.data;
    var ri = await sb.from('inv_venta_items').select('*').eq('venta_id', rv.data.id);
    ITEMS_ACTUAL = ri.data || [];
    renderVenta();
  }catch(e){ cont.innerHTML='<div class="card"><div class="empty">Error: '+e.message+'</div></div>'; }
}

function renderVenta(){
  var v = VENTA_ACTUAL;
  var fecha = new Date(v.fecha).toLocaleDateString('es-VE') + ' ' + new Date(v.fecha).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
  var prodsHtml = ITEMS_ACTUAL.map(function(it){
    return '<div class="prod"><span>'+(it.descripcion||'').replace(/</g,'&lt;')+'</span><span class="q">'+it.cantidad+' × $'+Number(it.precio_unitario).toFixed(2)+'</span></div>';
  }).join('');
  var yaEntregado = (v.estado==='entregado' || v.estado==='delivery');

  var accionesHtml;
  if(yaEntregado){
    var txtEstado = v.estado==='delivery' ? 'sali\u00f3 por DELIVERY' : 'fue ENTREGADA';
    accionesHtml = '<div style="text-align:center;color:var(--green-soft);font-size:13px;padding:10px;">\u2713 Esta venta ya '+txtEstado+'</div>'+
      '<div style="text-align:center;font-size:11px;color:var(--muted);padding-bottom:6px;">Para revertir se requiere autorizaci\u00f3n de administrador (pendiente del login)</div>';
  } else {
    // PASO 1: solo imprimir. PASO 2 (destinos) aparece tras imprimir.
    accionesHtml =
      '<div id="paso1"><button class="btn btn-ghost" id="btnNota">\ud83d\udda8\ufe0f Paso 1 · Imprimir nota para firma</button></div>'+
      '<div id="paso2" style="display:none;">'+
        '<div style="font-size:12px;color:var(--text-2);text-align:center;margin:10px 0 8px;">Nota impresa. Ahora elige el destino:</div>'+
        '<div class="acciones">'+
          '<button class="btn btn-green" id="btnEntregar">\u2713 Cliente lo retira</button>'+
          '<button class="btn btn-orange" id="btnPendiente">Queda pendiente</button>'+
        '</div>'+
        '<button class="btn" id="btnDelivery" style="margin-top:10px;background:linear-gradient(135deg,var(--blue),#2f7fc0);color:#fff;">\ud83d\ude9a Sale por delivery</button>'+
      '</div>';
  }

  document.getElementById('resultado').innerHTML =
    '<div class="card">'+
      '<div class="venta-head">'+
        '<div><div class="num">Venta #'+v.numero+'</div>'+
        '<div class="meta">'+fecha+(v.cliente_nombre?' \u00b7 '+v.cliente_nombre:' \u00b7 sin cliente')+'</div></div>'+
        '<span class="estado-badge '+claseEstado(v.estado)+'">'+nombreEstado(v.estado)+'</span>'+
      '</div>'+
      prodsHtml+
      '<div class="total-row"><span>Total</span><span class="amt">$'+Number(v.total).toFixed(2)+'</span></div>'+
      accionesHtml+
    '</div>'+
    '<div id="deliveryBox"></div>';

  if(!yaEntregado){
    document.getElementById('btnNota').addEventListener('click', function(){
      generarNota();
      // Tras imprimir, mostrar paso 2
      document.getElementById('paso1').style.display='none';
      document.getElementById('paso2').style.display='block';
    });
    document.getElementById('btnEntregar').addEventListener('click', function(){ confirmarEntrega('entregado'); });
    document.getElementById('btnPendiente').addEventListener('click', function(){ confirmarEntrega('pendiente_retirar'); });
    document.getElementById('btnDelivery').addEventListener('click', mostrarFormDelivery);
  }
}

function mostrarFormDelivery(){
  document.getElementById('deliveryBox').innerHTML =
    '<div class="card">'+
      '<label>Dirección de entrega</label>'+
      '<input type="text" id="delDir" placeholder="Dirección completa del cliente">'+
      '<div style="margin-top:12px;"><label>Teléfono de contacto</label>'+
      '<input type="tel" id="delTel" placeholder="Para que el repartidor pueda llamar"></div>'+
      '<button class="btn" id="btnConfirmDelivery" style="margin-top:14px;background:linear-gradient(135deg,var(--blue),#2f7fc0);color:#fff;">Confirmar salida por delivery</button>'+
    '</div>';
  document.getElementById('btnConfirmDelivery').addEventListener('click', function(){
    var dir = document.getElementById('delDir').value.trim();
    var tel = document.getElementById('delTel').value.trim();
    if(!dir){ toast('Escribe la dirección de entrega'); return; }
    confirmarEntrega('delivery', dir, tel);
  });
  document.getElementById('deliveryBox').scrollIntoView({behavior:'smooth', block:'center'});
}

async function confirmarEntrega(nuevoEstado, direccion, telefono){
  if(!VENTA_ACTUAL) return;
  try{
    var datos = { estado:nuevoEstado };
    if(nuevoEstado==='delivery'){
      datos.notas = (VENTA_ACTUAL.notas?VENTA_ACTUAL.notas+' | ':'') + 'DELIVERY a: '+direccion+(telefono?' · Tel: '+telefono:'');
    }
    var r = await sb.from('inv_ventas').update(datos).eq('id', VENTA_ACTUAL.id);
    if(r.error) throw r.error;
    // El estado del item: delivery y entregado salen del stock; pendiente no
    var estadoItem = (nuevoEstado==='pendiente_retirar') ? 'pendiente_retirar' : 'entregado';
    await sb.from('inv_venta_items').update({ estado_item:estadoItem }).eq('venta_id', VENTA_ACTUAL.id);
    VENTA_ACTUAL.estado = nuevoEstado;
    if(datos.notas) VENTA_ACTUAL.notas = datos.notas;
    document.getElementById('deliveryBox').innerHTML='';
    renderVenta();
    var msg = nuevoEstado==='entregado' ? '\u2713 Venta #'+VENTA_ACTUAL.numero+' ENTREGADA'
      : nuevoEstado==='delivery' ? '\ud83d\ude9a Venta #'+VENTA_ACTUAL.numero+' sali\u00f3 por DELIVERY'
      : 'Venta #'+VENTA_ACTUAL.numero+' queda PENDIENTE por retirar';
    toast(msg, 3500);
  }catch(e){ toast('Error: '+e.message, 4000); }
}

function bloqueCondicionesGarantia(){
  return '<div class="center bold" style="font-size:12px;">CONDICIONES DE GARANTIA</div>'+
    '<p>La garantia de cada producto la ofrece su MARCA/FABRICANTE, segun su plazo y condiciones. MERCANTIL YUMANA es intermediario: orientamos y asistimos en el proceso. NO somos el fabricante.</p>'+
    '<h3>PLAZOS (desde la entrega):</h3>'+
    '<p>- Peq. electrodomesticos, cocinas, campanas: 1 mes</p>'+
    '<p>- Televisores: 3 meses</p>'+
    '<p>- Neveras, congeladores, lavadoras, aires: 6 meses</p>'+
    '<p>- Colchones: 12 meses</p>'+
    '<p>El plazo final lo define cada marca.</p>'+
    '<h3>** REVISION Y PRUEBA - LEER **</h3>'+
    '<p class="crit">1. Todo producto se revisa en tienda al entregarse.</p>'+
    '<p class="crit">2. Lo que no se prueba al momento (neveras, congeladores): 48 HORAS MAX para probar y notificar fallas.</p>'+
    '<p class="crit">3. Dentro de 48h con falla de fabrica: puede haber CAMBIO.</p>'+
    '<p class="crit">4. Despues de 48h: SOLO REPARACION, NO CAMBIO.</p>'+
    '<p class="crit">5. No hay cambio salvo que la marca lo autorice.</p>'+
    '<p class="crit">6. TIEMPO DE REPARACION: depende del fabricante y repuestos. Puede tomar semanas o mas de un mes. NO garantizamos plazo de devolucion ni respondemos por demoras del fabricante.</p>'+
    '<p class="crit">7. NO se presta producto de reemplazo durante la reparacion.</p>'+
    '<p class="crit">8. TRASLADO: en las primeras 48h con falla de fabrica lo asume la tienda. Despues, lo asume el cliente.</p>'+
    '<h3>PROCESO (OBLIGATORIO):</h3>'+
    '<p>- Seguir los pasos que la tienda le facilitara.</p>'+
    '<p>- NO traiga el producto sin iniciar el proceso. Solo se recibe si la marca lo indica; de lo contrario NO procede.</p>'+
    '<h3>NO CUBRE:</h3>'+
    '<p>1. Daño fisico: pantallas/controles partidos, carcasas rotas, golpes.</p>'+
    '<p>2. Variaciones electricas, sobrecargas, rayos (use protector).</p>'+
    '<p>3. Voltaje incorrecto (110v en 220v o viceversa): anula garantia.</p>'+
    '<p>4. Mala instalacion de gas/agua por terceros.</p>'+
    '<p>5. Tercer toma (tierra) cortado o modificado.</p>'+
    '<p>6. Reparado por terceros ajenos a la tienda.</p>'+
    '<p>7. Serial/etiqueta removida o alterada.</p>'+
    '<p>8. Uso no domestico / comercial / intensivo: anula garantia.</p>'+
    '<p>9. No transferible: solo comprador de la factura.</p>'+
    '<p>10. Fuera del plazo de cobertura.</p>'+
    '<p>11. Humedad, liquidos, insectos, oxido.</p>'+
    '<p>12. Desgaste normal por uso.</p>'+
    '<h3>AIRES SPLIT:</h3>'+
    '<p>- Una vez instalado NO se desmonta para reclamo. Si se bajo, NO procede.</p>'+
    '<p>- Reportar segun instrucciones del fabricante.</p>'+
    '<p>- Instalacion por personal calificado. Uso domestico.</p>';
}

function estilosTermicos(){
  return '<style>'+
    '@page { size: 80mm auto; margin: 2mm; }'+
    '* { box-sizing:border-box; margin:0; padding:0; color:#000 !important; }'+
    'body { font-family:"Courier New",monospace; font-size:11px; width:76mm; color:#000; padding:2mm; font-weight:600; line-height:1.35; }'+
    '.center { text-align:center; }'+
    '.bold { font-weight:800; }'+
    '.brand { font-size:16px; font-weight:900; letter-spacing:2px; }'+
    '.tipo-doc { background:#000; color:#fff !important; padding:4px; margin:4px 0; font-weight:900; letter-spacing:1px; font-size:12px; text-align:center; }'+
    '.tipo-doc * { color:#fff !important; }'+
    '.divider { border-top:1px dashed #000; margin:5px 0; }'+
    '.divider-solid { border-top:2px solid #000; margin:5px 0; }'+
    '.row { display:flex; justify-content:space-between; padding:1.5px 0; gap:6px; }'+
    '.total { font-size:14px; font-weight:900; text-align:right; margin-top:4px; }'+
    'h3 { font-size:11px; margin:7px 0 3px; font-weight:900; letter-spacing:0.5px; }'+
    '.crit { font-weight:900; }'+
    '.serial { margin:8px 0; font-weight:800; }'+
    '.acepta { border:1.5px solid #000; padding:6px; margin-top:8px; font-weight:900; font-size:10.5px; text-align:center; }'+
    '.conserve { border:2px solid #000; padding:6px; margin-top:6px; font-weight:800; font-size:10px; text-align:center; background:#000; color:#fff !important; }'+
    '.conserve * { color:#fff !important; }'+
    '.firma { margin-top:26px; }'+
    '.firma-line { border-top:1.5px solid #000; width:80%; margin:0 auto 3px; padding-top:2px; text-align:center; font-size:10px; }'+
    '.foot { margin-top:10px; font-size:9px; text-align:center; }'+
    'p { padding:1px 0; }'+
    '</style>';
}

function imprimirSoloGarantia(){
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Condiciones de Garantia</title>'+
    estilosTermicos()+'</head><body>'+
    '<div class="center brand">MERCANTIL YUMANA</div>'+
    '<div class="tipo-doc">CONDICIONES DE GARANTIA</div>'+
    '<div class="divider"></div>'+
    bloqueCondicionesGarantia()+
    '<div class="divider"></div>'+
    '<div class="center" style="font-size:9.5px;">Documento informativo. NO sustituye la nota de entrega firmada con el serial del producto.</div>'+
    '<div class="divider"></div>'+
    '<div class="foot">RIF V-25.650.7389 · Socopo, Edo. Barinas</div>'+
    '</body></html>';
  var w = window.open('', '_blank');
  if(!w){ toast('Permite ventanas emergentes para imprimir'); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ w.print(); }, 400);
}

function generarNota(){
  var v = VENTA_ACTUAL;
  var ahora = new Date();
  var fechaStr = ahora.toLocaleDateString('es-VE');
  var horaStr = ahora.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
  var filas = ITEMS_ACTUAL.map(function(it){
    var ct = (it.cantidad>1) ? (it.cantidad+'x ') : '';
    return '<div class="row"><span>'+ct+(it.descripcion||'')+'</span><span class="bold">$'+Number(it.subtotal).toFixed(2)+'</span></div>';
  }).join('');
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nota de Entrega</title>'+
    estilosTermicos()+'</head><body>'+

    '<div class="center brand">MERCANTIL YUMANA</div>'+
    '<div class="tipo-doc">NOTA DE ENTREGA</div>'+
    '<div>Venta #: <span class="bold">'+v.numero+'</span></div>'+
    '<div>Cliente: '+(v.cliente_nombre||'____________')+'</div>'+
    '<div>Fecha: '+fechaStr+' '+horaStr+'</div>'+
    '<div class="divider"></div>'+

    '<h3>PRODUCTOS ENTREGADOS</h3>'+
    filas+
    '<div class="divider"></div>'+
    '<div class="total">TOTAL: $'+Number(v.total).toFixed(2)+'</div>'+
    '<div class="divider-solid"></div>'+

    '<div class="serial">SERIAL(ES): _______________________</div>'+
    '<div class="divider"></div>'+

    bloqueCondicionesGarantia()+

    '<div class="acepta">DECLARO QUE LEI Y ACEPTE TODAS LAS CONDICIONES DE GARANTIA, Y RECIBI EL PRODUCTO CONFORME.</div>'+

    '<div class="conserve">CONSERVE ESTA NOTA. Es su UNICO comprobante con su firma y el serial del producto. La impresion termica puede desvanecerse con el tiempo: guardela en lugar seguro y presentela para cualquier reclamo. Las condiciones de garantia pueden reimprimirse, pero la firma y el serial NO.</div>'+

    '<div class="firma">'+
      '<div class="firma-line">Firma del cliente</div>'+
    '</div>'+
    '<div class="firma">'+
      '<div class="firma-line">Firma de la tienda</div>'+
    '</div>'+

    '<div class="divider"></div>'+
    '<div class="foot">RIF V-25.650.7389 · Socopo, Edo. Barinas</div>'+
    '</body></html>';
  var w = window.open('', '_blank');
  if(!w){ toast('Permite ventanas emergentes para imprimir'); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(function(){ w.print(); }, 400);
}

document.getElementById('btnBuscar').addEventListener('click', buscarVenta);
document.getElementById('btnSoloGarantia').addEventListener('click', imprimirSoloGarantia);
document.getElementById('numVenta').addEventListener('keydown', function(e){ if(e.key==='Enter') buscarVenta(); });
</script>
</body>
</html>
