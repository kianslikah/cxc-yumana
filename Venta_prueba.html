<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Venta — PRUEBA</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0b0b12; --bg-grad1:#12121e; --bg-grad2:#0a0a10;
    --surface:#15151f; --surface-2:#1d1d2b; --surface-3:#22222f;
    --border:#2c2c40; --border-soft:#232331; --gold:#c9a24c; --gold-bright:#e8cd83; --gold-dim:#8c7536;
    --text:#ece6d8; --text-2:#b8b2a6; --muted:#6f6f82;
    --green:#2ec27a; --green-soft:#7fe6a8; --red:#e85d4c; --orange:#f0a838; --blue:#4ba3e0;
    --shadow:0 8px 32px rgba(0,0,0,0.45); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
    --glow:0 0 0 1px rgba(201,162,76,0.15), 0 4px 24px rgba(201,162,76,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-grad1), transparent),radial-gradient(ellipse 70% 50% at 100% 100%, var(--bg-grad2), transparent);
    background-attachment:fixed; color:var(--text); font-family:'Outfit',sans-serif;
    min-height:100vh; padding:20px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .banner{background:rgba(240,168,56,0.12); border:1px solid #f0a83855; border-radius:12px; padding:10px 14px; margin-bottom:18px; font-size:12.5px; color:#f0a838;}
  h1{font-family:'Fraunces',serif; font-size:24px; color:var(--gold); margin-bottom:4px;}
  .sub{color:var(--text-2); font-size:13px; margin-bottom:22px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  label{display:block; font-size:11px; font-weight:600; color:var(--gold); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;}
  input, select{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px; font-family:inherit; outline:none;}
  input:focus, select:focus{box-shadow:var(--glow); border-color:var(--gold-dim);}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  .mt{margin-top:12px;}
  .sug{position:relative;}
  .sug-box{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--surface-2); border:1px solid var(--gold-dim); border-radius:10px; max-height:260px; overflow-y:auto; z-index:50; box-shadow:var(--shadow); display:none;}
  .sug-item{padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--border);}
  .sug-item:hover{background:var(--surface-3);}
  .sug-item .n{font-weight:600; font-size:13.5px;}
  .sug-item .d{font-size:11px; color:var(--gold-bright); margin-top:2px;}
  .sug-item .st{font-size:11px; margin-top:2px;}
  .st.ok{color:var(--green-soft);} .st.no{color:var(--red);}
  .btn{background:linear-gradient(135deg,var(--gold),var(--gold-dim)); color:#0b0b12; border:none; border-radius:11px; padding:14px; font-size:14px; font-weight:700; cursor:pointer; width:100%; font-family:inherit; transition:transform .15s;}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-add{background:var(--surface-3); color:var(--gold); border:1px solid var(--gold-dim);}
  .item{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .item .info{flex:1;}
  .item .info b{font-size:13.5px;} .item .info span{font-size:11px; color:var(--text-2); display:block; margin-top:2px;}
  .item .del{background:rgba(232,93,76,0.15); color:var(--red); border:none; border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:16px;}
  .total{display:flex; justify-content:space-between; align-items:center; padding:14px 0 4px; border-top:1px solid var(--border); margin-top:8px;}
  .total .lbl{font-size:13px; color:var(--text-2);}
  .total .amt{font-family:'Fraunces',serif; font-size:22px; color:var(--green-soft); font-weight:700;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:18px;}
  #toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--gold-dim); color:var(--text); padding:12px 20px; border-radius:12px; font-size:13px; box-shadow:var(--shadow); display:none; z-index:200; max-width:90%;}
  .pill{display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:6px; background:rgba(75,163,224,0.15); color:var(--blue); margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">⚠ MODO PRUEBA — Esta pantalla registra ventas reales en la base de datos. Úsala solo con productos de prueba hasta validar que todo funcione.</div>
  <h1>Registro de Venta</h1>
  <div class="sub">Fase 2 · El cliente factura en VALERY, aquí se registra y descuenta el inventario</div>

  <div class="card">
    <label>Tienda donde se vende</label>
    <select id="tienda"></select>

    <div class="mt sug">
      <label>Buscar producto</label>
      <input type="text" id="buscar" placeholder="Nombre o código del producto..." autocomplete="off">
      <div class="sug-box" id="sugBox"></div>
    </div>
  </div>

  <div class="card">
    <label>Productos de esta venta</label>
    <div id="items"><div class="empty">Aún no has agregado productos</div></div>
    <div class="total">
      <span class="lbl">Total de la venta</span>
      <span class="amt" id="total">$0.00</span>
    </div>
  </div>

  <div class="card">
    <label>Cliente (opcional — solo si pide factura)</label>
    <input type="text" id="cliente" placeholder="Nombre del cliente (puede quedar vacío)">
    <div class="row mt">
      <div><label>Método de pago</label>
        <select id="metodo">
          <option value="Efectivo USD">Efectivo USD</option>
          <option value="Bolivares">Bolívares</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Pago Movil">Pago Móvil</option>
          <option value="Zelle">Zelle</option>
          <option value="USDT">USDT</option>
        </select>
      </div>
      <div><label>Ref. VALERY (opcional)</label>
        <input type="text" id="valery" placeholder="N° nota / factura">
      </div>
    </div>
  </div>

  <button class="btn" id="btnVender" disabled>Registrar venta y descontar inventario</button>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL='https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY='sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let CATALOGO=[];      // productos
let UBICACIONES=[];   // ubicaciones tipo tienda
let CARRITO=[];       // productos de la venta actual

function toast(msg, ms){ var t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(function(){t.style.display='none';}, ms||2800); }

// ===== Cargar catálogo (paginado, como en apartados) =====
async function cargarTodo(){
  try{
    // Ubicaciones tipo tienda
    var ru = await sb.from('inv_ubicaciones').select('id, nombre, tipo').eq('activo', true).order('id');
    UBICACIONES = (ru.data||[]);
    var tiendas = UBICACIONES.filter(function(u){ return u.tipo === 'tienda'; });
    var sel = document.getElementById('tienda');
    sel.innerHTML = tiendas.map(function(t){ return '<option value="'+t.id+'">'+t.nombre+'</option>'; }).join('');

    // Productos (paginado para traer todos)
    var todos=[], desde=0, tam=1000, seguir=true;
    while(seguir){
      var r = await sb.from('inv_productos').select('id, codigo_valery, descripcion, precio_usd, activo').order('id').range(desde, desde+tam-1);
      if(r.data && r.data.length>0){ todos=todos.concat(r.data); desde+=tam; if(r.data.length<tam) seguir=false; }
      else seguir=false;
      if(desde>20000) seguir=false;
    }
    CATALOGO=todos;
    toast('Catálogo cargado: '+CATALOGO.length+' productos');
  }catch(e){ toast('Error cargando: '+e.message, 4000); }
}

// ===== Buscar producto =====
var inputBuscar = document.getElementById('buscar');
var sugBox = document.getElementById('sugBox');
inputBuscar.addEventListener('input', function(){
  var q = this.value.toLowerCase().trim();
  if(q.length<2){ sugBox.style.display='none'; return; }
  var palabras = q.split(/\s+/);
  var res = CATALOGO.filter(function(p){
    var t = ((p.descripcion||'')+' '+(p.codigo_valery||'')).toLowerCase();
    return palabras.every(function(w){ return t.indexOf(w)>=0; });
  }).slice(0,25);
  if(res.length===0){ sugBox.innerHTML='<div class="empty">Sin resultados</div>'; sugBox.style.display='block'; return; }
  sugBox.innerHTML = res.map(function(p){
    var precio = p.precio_usd ? '$'+Number(p.precio_usd).toFixed(2) : 'sin precio';
    return '<div class="sug-item" data-id="'+p.id+'">'+
      '<div class="n">'+(p.descripcion||'').replace(/</g,'&lt;')+'</div>'+
      '<div class="d">'+(p.codigo_valery||'')+' · '+precio+'</div>'+
      '<div class="st" data-stock-for="'+p.id+'">Verificando stock...</div>'+
    '</div>';
  }).join('');
  sugBox.style.display='block';
  // Verificar stock de cada uno en la tienda seleccionada
  var tiendaId = document.getElementById('tienda').value;
  res.forEach(function(p){ verificarStock(p.id, tiendaId); });
});

async function verificarStock(productoId, ubicacionId){
  try{
    var r = await sb.from('inv_existencias').select('existencia').eq('producto_id', productoId).eq('ubicacion_id', ubicacionId).maybeSingle();
    var ex = (r.data && r.data.existencia) ? Number(r.data.existencia) : 0;
    var el = document.querySelector('[data-stock-for="'+productoId+'"]');
    if(el){
      if(ex>0){ el.textContent='✓ '+ex+' en esta tienda'; el.className='st ok'; }
      else { el.textContent='✗ Sin stock en esta tienda'; el.className='st no'; }
    }
  }catch(e){}
}

// Seleccionar producto de las sugerencias
sugBox.addEventListener('click', function(e){
  var item = e.target.closest('.sug-item');
  if(!item) return;
  var id = parseInt(item.dataset.id,10);
  var p = CATALOGO.find(function(x){ return x.id===id; });
  if(!p) return;
  agregarAlCarrito(p);
  inputBuscar.value=''; sugBox.style.display='none';
});

function agregarAlCarrito(p){
  // si ya está, suma cantidad
  var existe = CARRITO.find(function(x){ return x.id===p.id; });
  if(existe){ existe.cantidad++; }
  else { CARRITO.push({ id:p.id, descripcion:p.descripcion, precio:Number(p.precio_usd||0), cantidad:1 }); }
  renderCarrito();
}

function quitarDelCarrito(id){ CARRITO=CARRITO.filter(function(x){ return x.id!==id; }); renderCarrito(); }

function renderCarrito(){
  var cont = document.getElementById('items');
  if(CARRITO.length===0){ cont.innerHTML='<div class="empty">Aún no has agregado productos</div>'; document.getElementById('total').textContent='$0.00'; document.getElementById('btnVender').disabled=true; return; }
  cont.innerHTML = CARRITO.map(function(it){
    var sub = it.precio*it.cantidad;
    return '<div class="item">'+
      '<div class="info"><b>'+(it.descripcion||'').replace(/</g,'&lt;')+'</b><span>'+it.cantidad+' × $'+it.precio.toFixed(2)+' = $'+sub.toFixed(2)+'</span></div>'+
      '<input type="number" min="1" value="'+it.cantidad+'" data-qty="'+it.id+'" style="width:60px;text-align:center;">'+
      '<button class="del" data-del="'+it.id+'">×</button>'+
    '</div>';
  }).join('');
  var total = CARRITO.reduce(function(s,it){ return s+it.precio*it.cantidad; },0);
  document.getElementById('total').textContent='$'+total.toFixed(2);
  document.getElementById('btnVender').disabled=false;
}

// cambios de cantidad y borrar
document.getElementById('items').addEventListener('input', function(e){
  if(e.target.dataset.qty){
    var id=parseInt(e.target.dataset.qty,10);
    var it=CARRITO.find(function(x){return x.id===id;});
    if(it){ it.cantidad=Math.max(1, parseInt(e.target.value||'1',10)); renderCarrito(); }
  }
});
document.getElementById('items').addEventListener('click', function(e){
  if(e.target.dataset.del){ quitarDelCarrito(parseInt(e.target.dataset.del,10)); }
});

// Si cambia la tienda, limpiar carrito (el stock es por tienda)
document.getElementById('tienda').addEventListener('change', function(){
  if(CARRITO.length>0){ CARRITO=[]; renderCarrito(); toast('Carrito limpiado: cambiaste de tienda'); }
});

// ===== REGISTRAR VENTA =====
document.getElementById('btnVender').addEventListener('click', async function(){
  var btn=this;
  if(CARRITO.length===0) return;
  btn.disabled=true; btn.textContent='Registrando...';
  try{
    var tiendaId = parseInt(document.getElementById('tienda').value,10);
    var cliente = document.getElementById('cliente').value.trim();
    var metodo = document.getElementById('metodo').value;
    var valery = document.getElementById('valery').value.trim();
    var total = CARRITO.reduce(function(s,it){ return s+it.precio*it.cantidad; },0);

    // 1) Validar stock ANTES de registrar (evitar sobreventa)
    for(var i=0;i<CARRITO.length;i++){
      var it=CARRITO[i];
      var rs = await sb.from('inv_existencias').select('existencia').eq('producto_id', it.id).eq('ubicacion_id', tiendaId).maybeSingle();
      var ex = (rs.data && rs.data.existencia) ? Number(rs.data.existencia) : 0;
      if(ex < it.cantidad){
        toast('✗ Sin stock suficiente de "'+it.descripcion+'" (hay '+ex+', pides '+it.cantidad+')', 4500);
        btn.disabled=false; btn.textContent='Registrar venta y descontar inventario';
        return;
      }
    }

    // 2) Crear la venta (cabecera)
    var rv = await sb.from('inv_ventas').insert({
      cliente_nombre: cliente||null,
      tienda_id: tiendaId,
      estado: 'vendido',
      metodo_pago: metodo,
      total: total,
      valery_ref: valery||null,
      registrado_por: 'PRUEBA'
    }).select('id, numero').single();
    if(rv.error) throw rv.error;
    var ventaId = rv.data.id;

    // 3) Crear los items + movimientos de salida (descuenta inventario)
    var items=[], movs=[];
    CARRITO.forEach(function(it){
      items.push({ venta_id:ventaId, producto_id:it.id, descripcion:it.descripcion, cantidad:it.cantidad, precio_unitario:it.precio, subtotal:it.precio*it.cantidad, ubicacion_id:tiendaId, estado_item:'vendido' });
      movs.push({ producto_id:it.id, tipo:'venta', cantidad_solicitada:it.cantidad, cantidad_confirmada:it.cantidad, ubicacion_origen:tiendaId, estado:'confirmado', referencia:'Venta #'+rv.data.numero, cliente:cliente||null, usuario:'PRUEBA', venta_id:ventaId, confirmado_en:new Date().toISOString() });
    });
    var ri = await sb.from('inv_venta_items').insert(items);
    if(ri.error) throw ri.error;
    var rm = await sb.from('inv_movimientos').insert(movs);
    if(rm.error) throw rm.error;

    toast('✓ Venta #'+rv.data.numero+' registrada · inventario descontado', 4000);
    CARRITO=[]; renderCarrito();
    document.getElementById('cliente').value=''; document.getElementById('valery').value='';
    btn.textContent='Registrar venta y descontar inventario';
  }catch(e){
    toast('Error: '+(e.message||e), 5000);
    btn.disabled=false; btn.textContent='Registrar venta y descontar inventario';
  }
});

// Iniciar
cargarTodo();
</script>
</body>
</html>
