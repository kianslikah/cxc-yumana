<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mercantil Yumana — Mayoristas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root, [data-theme="dark"]{
  --bg:#0b0b12; --bg-grad1:#12121e; --bg-grad2:#0a0a10;
  --surface:#15151f; --surface-2:#1d1d2b; --surface-3:#22222f;
  --border:#2c2c40; --border-soft:#232331; --gold:#c9a24c; --gold-bright:#e8cd83; --gold-dim:#8c7536;
  --text:#ece6d8; --text-2:#b8b2a6; --muted:#6f6f82;
  --green:#2ec27a; --green-soft:#7fe6a8;
  --red:#e85d4c; --red-soft:#ff9485;
  --orange:#f0a838; --blue:#4ba3e0; --purple:#a872e8;
  --shadow:0 8px 32px rgba(0,0,0,0.45); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
  --glow:0 0 0 1px rgba(201,162,76,0.15), 0 4px 24px rgba(201,162,76,0.08);
}
[data-theme="light"]{
  --bg:#f4f2ec; --bg-grad1:#faf8f2; --bg-grad2:#eeebe2;
  --surface:#ffffff; --surface-2:#f6f4ee; --surface-3:#efece3;
  --border:#ddd8cb; --border-soft:#e8e4d8; --gold:#9a7d2e; --gold-bright:#b8923a; --gold-dim:#c9b888;
  --text:#23211a; --text-2:#54514a; --muted:#8f8b7e;
  --green:#1f9d5e; --green-soft:#2ec27a;
  --red:#cc4434; --red-soft:#e74c3c;
  --orange:#d18820; --blue:#2f7fc0; --purple:#8845c4;
  --shadow:0 8px 32px rgba(120,110,80,0.12); --shadow-sm:0 2px 12px rgba(120,110,80,0.08);
  --glow:0 0 0 1px rgba(154,125,46,0.15), 0 4px 24px rgba(154,125,46,0.06);
}
html,body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-grad1), transparent),radial-gradient(ellipse 70% 50% at 100% 100%, var(--bg-grad2), transparent);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Outfit',-apple-system, system-ui, 'Helvetica Neue', sans-serif;
  min-height:100vh; font-size:15px; line-height:1.5;
}
h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif; letter-spacing:-0.2px;}
em{font-style:italic; color:var(--gold);}

/* ===== LOGIN ===== */
#loginView{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:36px 30px; width:100%; max-width:400px; box-shadow:var(--shadow);
}
.login-brand{text-align:center; margin-bottom:8px;}
.login-brand .logo{font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--gold); letter-spacing:0.5px;}
.login-brand .sub{font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-top:2px;}
.login-title{text-align:center; font-size:15px; color:var(--text-2); margin:18px 0 24px;}
.fg{margin-bottom:16px;}
.fg label{display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; font-weight:500;}
.fg input, .fg select, .fg textarea{
  width:100%; padding:12px 14px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); border-radius:10px; font-size:16px; font-family:inherit;
}
.fg input:focus, .fg select:focus, .fg textarea:focus{outline:none; border-color:var(--gold);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 18px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
  font-family:inherit; cursor:pointer; transition:all .15s ease;
}
.btn:hover{border-color:var(--gold);}
.btn-primary{background:var(--gold); color:#1a1206; border-color:var(--gold);}
.btn-primary:hover{background:var(--gold-bright);}
.btn-green{background:var(--green); color:#04140b; border-color:var(--green);}
.btn-danger{background:transparent; color:var(--red-soft); border-color:var(--red);}
.btn-ghost{background:transparent;}
.btn-block{width:100%;}
.login-msg{font-size:13px; text-align:center; margin-top:12px; min-height:18px;}
.login-msg.error{color:var(--red-soft);}

/* ===== APP LAYOUT (sidebar lateral) ===== */
#appView{display:none; min-height:100vh;}
.layout{display:flex; min-height:100vh; width:100%; max-width:100vw; overflow-x:hidden;}
.sidebar{width:248px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); padding:22px 16px; display:flex; flex-direction:column; position:fixed; left:0; top:0; height:100vh; height:100dvh; overflow-y:auto; z-index:30;}
.layout-main{flex:1; min-width:0; margin-left:248px; max-width:calc(100vw - 248px);}
.side-brand{display:flex; align-items:center; gap:11px; padding:0 6px 20px; margin-bottom:6px; border-bottom:1px solid var(--border);}
.side-emblem{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--gold),var(--gold-dim)); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:20px; color:#1a1206; flex-shrink:0;}
.side-title{font-family:'Fraunces',serif; font-size:14px; font-weight:600; line-height:1.1;}
.side-title small{display:block; font-family:'Outfit',sans-serif; font-size:9px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin-top:3px; font-weight:500;}
.side-live{display:inline-flex; align-items:center; gap:5px; font-size:10px; color:var(--green-soft); margin:12px 6px 0; font-weight:600;}
.side-live::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--green);}
.side-nav{flex:1; margin-top:14px; display:flex; flex-direction:column; gap:4px;}
.nav-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:11px; color:var(--text-2); font-size:14.5px; font-weight:500; cursor:pointer; transition:all .18s ease; border:1px solid transparent; background:transparent; font-family:inherit; text-align:left; width:100%;}
.nav-item svg{width:19px; height:19px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--gold); color:#1a1206; border-color:var(--gold);}
.side-foot{padding-top:14px; margin-top:8px; border-top:1px solid var(--border); flex-shrink:0;}
.side-user{display:flex; align-items:center; gap:10px; padding:6px;}
.side-avatar{width:34px; height:34px; border-radius:10px; background:var(--gold); color:#1a1206; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700;}
.side-user .un{font-size:13px; font-weight:600; line-height:1.2;}
.side-user .ur{font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
.side-links{display:flex; gap:8px; margin-top:10px;}
.side-links button{flex:1; text-align:center; background:transparent; border:1px solid var(--border); color:var(--text-2); border-radius:9px; padding:9px; font-size:12px; font-family:inherit; cursor:pointer; transition:all .18s ease;}
.side-links .theme-btn:hover{border-color:var(--gold); color:var(--gold);}
.side-links .logout-btn:hover{border-color:var(--red); color:var(--red);}
@media(max-width:800px){
  .sidebar{position:fixed; width:100%; height:auto; flex-direction:row; align-items:center; padding:10px 14px; top:0; border-right:none; border-bottom:1px solid var(--border); overflow-x:auto; gap:8px;}
  .side-brand{border-bottom:none; padding:0; margin:0; flex-shrink:0;}
  .side-title small,.side-live{display:none;}
  .side-nav{flex-direction:row; margin-top:0; flex:0; gap:4px;}
  .nav-item{padding:9px 12px; font-size:13px;}
  .nav-item span.lbl{display:none;}
  .side-foot{border-top:none; padding:0; margin:0; margin-left:auto; display:flex; align-items:center; gap:8px;}
  .side-user .info-txt{display:none;}
  .side-links{margin:0;}
  .layout-main{margin-left:0; max-width:100vw; margin-top:60px;}
}

.container{max-width:1100px; margin:0 auto; padding:20px;}
.screen-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.screen-header h1{font-size:24px; font-weight:700;}
.screen-header .sub{font-size:13px; color:var(--muted); margin-top:2px;}

.search-wrap{position:relative; margin-bottom:16px;}
.search-input{
  width:100%; padding:12px 40px 12px 40px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); border-radius:10px; font-size:15px; font-family:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%237a7a8e' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat:no-repeat; background-position:13px center;
}
.search-input:focus{outline:none; border-color:var(--gold);}
.search-clear{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:24px; height:24px; border:none; background:var(--surface-2); color:var(--muted); border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:15px; padding:0;}
.search-clear:hover{color:var(--text); background:var(--border);}
.search-wrap.has-text .search-clear{display:flex;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow-sm);}
.cli-card{display:flex; align-items:center; gap:14px; cursor:pointer; transition:border-color .15s;}
.cli-card:hover{border-color:var(--gold);}
.cli-card .av{width:46px; height:46px; border-radius:12px; background:var(--surface-2); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0;}
.cli-card .info{flex:1; min-width:0;}
.cli-card .info h3{font-size:16px; font-weight:700; margin-bottom:2px;}
.cli-card .info p{font-size:12px; color:var(--muted);}
.tag{display:inline-block; font-size:10px; padding:3px 8px; border-radius:6px; font-weight:600; letter-spacing:0.3px;}
.tag.negocio{background:rgba(75,163,224,0.15); color:var(--blue);}
.tag.particular{background:rgba(168,114,232,0.15); color:var(--purple);}
.cli-card .saldo{text-align:right; flex-shrink:0;}
.cli-card .saldo .v{font-size:18px; font-weight:800; color:var(--gold);}
.cli-card .saldo .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state svg{opacity:0.4; margin-bottom:12px;}
.empty-state h3{font-size:17px; color:var(--text-2); margin-bottom:6px; font-family:'Fraunces';}
.empty-state p{font-size:13px;}

/* ===== MODAL ===== */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
  z-index:200; align-items:center; justify-content:center; padding:16px; overflow-x:hidden;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  max-width:480px; width:100%; max-height:92vh; overflow-y:auto; overflow-x:hidden; padding:24px;
  position:relative; overscroll-behavior:contain;
}
.modal *{max-width:100%; box-sizing:border-box;}
.modal h2{font-size:20px; margin-bottom:18px;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions .btn{flex:1;}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-msg{font-size:13px; margin-top:10px; min-height:16px;}
.modal-msg.error{color:var(--red-soft);}
.modal-msg.ok{color:var(--green-soft);}

/* ===== TOAST ===== */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
  background:var(--surface-3); border:1px solid var(--border); color:var(--text);
  padding:12px 20px; border-radius:12px; font-size:14px; font-weight:500;
  box-shadow:var(--shadow); z-index:500; transition:transform .3s ease; max-width:90%;
}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.s{border-color:var(--green);}
#toast.e{border-color:var(--red);}

.section-count{font-size:12px; color:var(--muted); margin-bottom:12px;}
.detail-banner{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px;}
.detail-banner .av-big{width:60px; height:60px; border-radius:14px; background:var(--gold); color:#1a1206; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px;}
.detail-banner h2{font-size:22px;}
.detail-banner p{font-size:13px; color:var(--muted); margin-top:3px;}
.kpi-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px;}
.kpi .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
.kpi .v{font-size:22px; font-weight:800;}
.kpi.gold .v{color:var(--gold);} .kpi.green .v{color:var(--green-soft);} .kpi.red .v{color:var(--red-soft);}
@media(max-width:560px){ .kpi-row{grid-template-columns:1fr;} .row-2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">MERCANTIL YUMANA</div>
      <div class="sub">Ventas al Mayor</div>
    </div>
    <div class="login-title">Inicia sesión para continuar</div>
    <div class="fg">
      <label>Usuario</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="Tu usuario">
    </div>
    <div class="fg">
      <label>Contraseña</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="Tu contraseña">
    </div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView">
 <div class="layout">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="side-emblem">Y</div>
      <div class="side-title">Mercantil Yumana<small>Ventas al Mayor</small></div>
    </div>
    <div class="side-live">EN VIVO</div>
    <nav class="side-nav">
      <button class="nav-item active" data-view="clientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span class="lbl">Clientes</span>
      </button>
      <button class="nav-item" data-view="facturas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        <span class="lbl">Facturas</span>
      </button>
      <button class="nav-item" data-view="usuarios" id="navUsuarios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 100 10 5 5 0 000-10zM3 21v-2a7 7 0 0114 0v2"/></svg>
        <span class="lbl">Usuarios</span>
      </button>
    </nav>
    <div class="side-foot">
      <div class="side-user">
        <div class="side-avatar" id="userAv">K</div>
        <div class="info-txt"><div class="un" id="userName">—</div><div class="ur" id="userRol">—</div></div>
      </div>
      <div class="side-links">
        <button class="theme-btn" id="btnTheme" title="Tema">🌙</button>
        <button class="logout-btn" id="btnLogout">Salir</button>
      </div>
    </div>
  </aside>

  <div class="layout-main">
  <!-- ===== VISTA CLIENTES ===== -->
  <div class="container view-section" id="view-clientes">
    <div class="screen-header">
      <div><h1>Clientes <em>mayoristas</em></h1><div class="sub" id="cliSub">—</div></div>
      <button class="btn btn-primary" id="btnNuevoCliente">+ Nuevo cliente</button>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="cliSearch" placeholder="Buscar por nombre, RIF o teléfono...">
    </div>
    <div id="cliList"></div>
  </div>

  <!-- ===== VISTA FACTURAS ===== -->
  <div class="container view-section" id="view-facturas" style="display:none;">
    <div class="screen-header">
      <div><h1>Facturas <em>del mayor</em></h1><div class="sub" id="facSub">—</div></div>
      <button class="btn btn-primary" id="btnNuevaFactura">+ Nueva factura</button>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="facSearch" placeholder="Buscar por cliente o número...">
    </div>
    <div id="facList"></div>
  </div>

  <!-- ===== VISTA USUARIOS ===== -->
  <div class="container view-section" id="view-usuarios" style="display:none;">
    <div class="screen-header">
      <div><h1>Usuarios del <em>sistema</em></h1><div class="sub">Quién puede acceder al mayorista</div></div>
      <button class="btn btn-primary" id="btnNuevoUsuario">+ Nuevo usuario</button>
    </div>
    <div id="usuList"></div>
  </div>
  </div>
 </div>
</div>

<!-- ===== MODAL CLIENTE ===== -->
<div class="modal-overlay" id="modalCliente">
  <div class="modal">
    <h2 id="modalClienteTitle">Nuevo cliente</h2>
    <div class="fg">
      <label>Nombre del negocio o persona *</label>
      <input type="text" id="ncNombre" placeholder="Ej: Comercial El Águila">
    </div>
    <div class="row-2">
      <div class="fg">
        <label>Tipo</label>
        <select id="ncTipo"><option value="negocio">Negocio</option><option value="particular">Particular</option></select>
      </div>
      <div class="fg">
        <label>Plazo de pago (días)</label>
        <input type="number" id="ncPlazo" value="30" inputmode="numeric">
      </div>
    </div>
    <div class="fg">
      <label>RIF / Cédula (opcional)</label>
      <input type="text" id="ncRif" placeholder="J-12345678-9">
    </div>
    <div class="fg">
      <label>Teléfono (opcional)</label>
      <input type="text" id="ncTelefono" placeholder="0412-1234567">
    </div>
    <div class="fg">
      <label>Dirección (opcional)</label>
      <input type="text" id="ncDireccion" placeholder="Dirección del negocio">
    </div>
    <div class="fg">
      <label>Notas (opcional)</label>
      <textarea id="ncNotas" rows="2" placeholder="Notas internas"></textarea>
    </div>
    <div class="modal-msg" id="ncMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="ncCancelar">Cancelar</button>
      <button class="btn btn-primary" id="ncGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL USUARIO ===== -->
<div class="modal-overlay" id="modalUsuario">
  <div class="modal">
    <h2 id="modalUsuarioTitle">Nuevo usuario</h2>
    <div class="fg"><label>Nombre completo *</label><input type="text" id="nuNombre" placeholder="Ej: Fayssal Slikah"></div>
    <div class="fg"><label>Usuario (para iniciar sesión) *</label><input type="text" id="nuUsuario" placeholder="fayssal" autocapitalize="off"></div>
    <div class="fg"><label>Contraseña *</label><input type="text" id="nuClave" placeholder="Contraseña"></div>
    <div class="fg"><label>Rol</label><select id="nuRol"><option value="vendedor">Vendedor (opera, no borra clientes)</option><option value="admin">Admin (acceso total)</option></select></div>
    <div class="modal-msg" id="nuMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="nuCancelar">Cancelar</button>
      <button class="btn btn-primary" id="nuGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL FACTURA ===== -->
<div class="modal-overlay" id="modalFactura">
  <div class="modal" style="max-width:560px;">
    <h2 id="modalFacturaTitle">Nueva factura</h2>
    <div class="fg">
      <label>Cliente *</label>
      <select id="nfCliente"></select>
    </div>
    <div class="row-2">
      <div class="fg"><label>Fecha</label><input type="date" id="nfFecha"></div>
      <div class="fg"><label>Vence (según plazo)</label><input type="date" id="nfVence"></div>
    </div>
    <label style="font-size:12px; color:var(--text-2); font-weight:500; display:block; margin-bottom:8px;">Productos *</label>
    <div id="nfItems"></div>
    <button class="btn btn-ghost btn-block" id="nfAddItem" style="margin-top:8px; border-style:dashed;">+ Agregar producto</button>

// ===== CARGA DE DATOS =====
async function traerTodo(tabla, orderCol, asc){
  var todos = [], desde = 0, tam = 1000;
  while(true){
    var q = sb.from(tabla).select('*');
    if(orderCol) q = q.order(orderCol, {ascending: !!asc});
    var r = await q.range(desde, desde + tam - 1);
    if(r.error) throw r.error;
    var lote = r.data || [];
    todos = todos.concat(lote);
    if(lote.length < tam) break;
    desde += tam;
  }
  return todos;
}

async function cargarDatos(){
  try {
    CLIENTES = (await traerTodo('may_clientes', 'nombre', true)).filter(function(c){ return !c.deleted_at; });
    FACTURAS = (await traerTodo('may_facturas', 'fecha', false)).filter(function(f){ return !f.deleted_at; });
    ABONOS = (await traerTodo('may_abonos', 'fecha', false)).filter(function(a){ return !a.deleted_at; });
    if(CURRENT_USER.rol === 'admin'){
      USUARIOS = await traerTodo('may_usuarios', 'nombre', true);
    }
    await cargarCatalogo();
    renderClientes();
    renderUsuarios();
  } catch(e){
    toast('Error al cargar datos', 'e');
  }
}

// Saldo de un cliente = suma facturas pendientes - suma abonos
function saldoCliente(clienteId){
  var totalFacturas = FACTURAS.filter(function(f){ return f.cliente_id === clienteId; })
    .reduce(function(s,f){ return s + parseFloat(f.monto_total||0); }, 0);
  var totalAbonos = ABONOS.filter(function(a){ return a.cliente_id === clienteId; })
    .reduce(function(s,a){ return s + parseFloat(a.monto||0); }, 0);
  return totalFacturas - totalAbonos;
}

var CATALOGO = [];
async function cargarCatalogo(){
  try {
    CATALOGO = await traerTodo('inv_productos', 'descripcion', true);
  } catch(e){ CATALOGO = []; }
}
function buscarEnCatalogo(texto){
  if(!texto || texto.length < 2) return [];
  var q = normalizar(texto);
  var palabras = q.split(/\s+/);
  return CATALOGO.filter(function(p){
    var desc = normalizar(p.descripcion||'');
    var cod = normalizar(p.codigo_valery||'');
    return palabras.every(function(w){ return desc.indexOf(w)>=0 || cod.indexOf(w)>=0; });
  }).slice(0, 40);
}

  try {
    var facturaData = {
      cliente_id: cliId,
      fecha: document.getElementById('nfFecha').value,
      fecha_vencimiento: document.getElementById('nfVence').value || null,
      monto_total: total,
      monto_pagado: 0,
      estado: 'pendiente',
      notas: document.getElementById('nfNotas').value.trim() || null,
      creado_por: CURRENT_USER.id
    };
    var rf = await sb.from('may_facturas').insert(facturaData).select().single();
    if(rf.error) throw rf.error;
    var facturaId = rf.data.id;
    // insertar items
    var itemsData = items.map(function(it){
      return {
        factura_id: facturaId,
        producto_id: it.producto_id || null,
        descripcion: it.descripcion,
        cantidad: it.cantidad || 1,
        precio_unitario: it.precio,
        subtotal: (it.cantidad||1) * it.precio
      };
    });
    var ri = await sb.from('may_factura_items').insert(itemsData);
    if(ri.error) throw ri.error;
    toast('Factura creada', 's');
    document.getElementById('modalFactura').classList.remove('active');
    await cargarDatos();
    renderFacturas();
  } catch(e){
    msg.className='modal-msg error'; msg.textContent = 'Error al guardar: ' + e.message;
  }
}

// ===== RENDER FACTURAS =====
function saldoFactura(f){
  return parseFloat(f.monto_total||0) - parseFloat(f.monto_pagado||0);
}
function renderFacturas(){
  var cont = document.getElementById('facList');
  var search = normalizar(document.getElementById('facSearch').value).trim();
  var list = FACTURAS.slice();
  if(search){
    list = list.filter(function(f){
      var cli = CLIENTES.find(function(c){ return c.id === f.cliente_id; });
      var txt = ((cli&&cli.nombre)||'') + ' ' + f.numero;
      return normalizar(txt).indexOf(search) >= 0;
    });
  }
  document.getElementById('facSub').textContent = FACTURAS.length + ' factura' + (FACTURAS.length===1?'':'s');
  if(list.length === 0){
    cont.innerHTML = '<div class="empty-state"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg><h3>' + (search?'Sin resultados':'Aún no hay facturas') + '</h3><p>' + (search?'Prueba con otro término':'Registra tu primera venta al mayor con el botón de arriba') + '</p></div>';
    return;
  }
  var hoy = new Date().toISOString().substring(0,10);
  cont.innerHTML = list.map(function(f){
    var cli = CLIENTES.find(function(c){ return c.id === f.cliente_id; });
    var saldo = saldoFactura(f);
    var pagada = saldo <= 0.01;
    var vencida = !pagada && f.fecha_vencimiento && f.fecha_vencimiento < hoy;
    var diasVenc = f.fecha_vencimiento ? Math.round((new Date(f.fecha_vencimiento) - new Date(hoy)) / 86400000) : null;
    var estadoTag = pagada
      ? '<span class="tag" style="background:rgba(46,194,122,0.15); color:var(--green-soft);">PAGADA</span>'
      : (vencida
        ? '<span class="tag" style="background:rgba(232,93,76,0.15); color:var(--red-soft);">Vencida hace ' + Math.abs(diasVenc) + ' días</span>'
        : '<span class="tag" style="background:rgba(240,168,56,0.15); color:var(--orange);">Vence en ' + diasVenc + ' días</span>');
    return '<div class="card cli-card" data-fac="' + f.id + '">' +
      '<div class="av">#' + f.numero + '</div>' +
      '<div class="info">' +
        '<h3>' + ((cli&&cli.nombre)||'—') + '</h3>' +
        '<p>' + fmtDate(f.fecha) + ' · ' + estadoTag + '</p>' +
      '</div>' +
      '<div class="saldo"><div class="v" style="color:' + (pagada?'var(--green-soft)':'var(--gold)') + ';">' + fmt(pagada?f.monto_total:saldo) + '</div><div class="l">' + (pagada?'Total':'Debe') + '</div></div>' +
    '</div>';
  }).join('');
}


function switchView(view){
  document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.toggle('active', b.dataset.view === view); });
  document.querySelectorAll('.view-section').forEach(function(s){ s.style.display = 'none'; });
  document.getElementById('view-' + view).style.display = 'block';
  if(view === 'facturas') renderFacturas();
}

// ===== TEMA =====
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') || 'dark';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('btnTheme').textContent = next === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('may_theme', next); } catch(e){}
}

// ===== BÚSQUEDA CON X =====
function initSearchClear(){
  var input = document.getElementById('cliSearch');
  var wrap = input.closest('.search-wrap');
  var btn = document.createElement('button');
  btn.type='button'; btn.className='search-clear'; btn.innerHTML='&times;';
  wrap.appendChild(btn);
  function toggle(){ wrap.classList.toggle('has-text', input.value.length>0); }
  input.addEventListener('input', function(){ toggle(); renderClientes(); });
  btn.addEventListener('click', function(){ input.value=''; toggle(); renderClientes(); input.focus(); });
}

  try {
    var saved = localStorage.getItem('may_user');
    if(saved){
      var id = JSON.parse(saved).id;
      var r = await sb.from('may_usuarios').select('*').eq('id', id).eq('activo', true).maybeSingle();
      if(r.data){ CURRENT_USER = r.data; entrarApp(); }
    }
  } catch(e){}
})();
</script>
