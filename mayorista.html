<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mercantil Yumana — Mayoristas</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root, [data-theme="dark"]{
  --bg:#0b0b12; --bg-grad1:#12121e; --bg-grad2:#0a0a10;
  --surface:#15151f; --surface-2:#1d1d2b; --surface-3:#22222f;
  --border:#2c2c40; --border-soft:#232331; --gold:#c9a24c; --gold-bright:#e8cd83; --gold-dim:#8c7536;
  --text:#ece6d8; --text-2:#b8b2a6; --muted:#6f6f82;
  --green:#2ec27a; --green-soft:#7fe6a8;
  --red:#e85d4c; --red-soft:#ff9485;
  --orange:#f0a838; --blue:#4ba3e0; --purple:#a872e8;
  --shadow:0 8px 32px rgba(0,0,0,0.45); --shadow-sm:0 2px 12px rgba(0,0,0,0.3);
  --glow:0 0 0 1px rgba(201,162,76,0.15), 0 4px 24px rgba(201,162,76,0.08);
}
[data-theme="light"]{
  --bg:#f4f2ec; --bg-grad1:#faf8f2; --bg-grad2:#eeebe2;
  --surface:#ffffff; --surface-2:#f6f4ee; --surface-3:#efece3;
  --border:#ddd8cb; --border-soft:#e8e4d8; --gold:#9a7d2e; --gold-bright:#b8923a; --gold-dim:#c9b888;
  --text:#23211a; --text-2:#54514a; --muted:#8f8b7e;
  --green:#1f9d5e; --green-soft:#2ec27a;
  --red:#cc4434; --red-soft:#e74c3c;
  --orange:#d18820; --blue:#2f7fc0; --purple:#8845c4;
  --shadow:0 8px 32px rgba(120,110,80,0.12); --shadow-sm:0 2px 12px rgba(120,110,80,0.08);
  --glow:0 0 0 1px rgba(154,125,46,0.15), 0 4px 24px rgba(154,125,46,0.06);
}
html,body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 80% 60% at 50% -10%, var(--bg-grad1), transparent),radial-gradient(ellipse 70% 50% at 100% 100%, var(--bg-grad2), transparent);
  background-attachment:fixed;
  color:var(--text);
  font-family:'Outfit',-apple-system, system-ui, 'Helvetica Neue', sans-serif;
  min-height:100vh; font-size:15px; line-height:1.5;
}
h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif; letter-spacing:-0.2px;}
em{font-style:italic; color:var(--gold);}

/* ===== LOGIN ===== */
#loginView{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:36px 30px; width:100%; max-width:400px; box-shadow:var(--shadow);
}
.login-brand{text-align:center; margin-bottom:8px;}
.login-brand .logo{font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--gold); letter-spacing:0.5px;}
.login-brand .sub{font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-top:2px;}
.login-title{text-align:center; font-size:15px; color:var(--text-2); margin:18px 0 24px;}
.fg{margin-bottom:16px;}
.fg label{display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; font-weight:500;}
.fg input, .fg select, .fg textarea{
  width:100%; padding:12px 14px; background:var(--surface-2); border:1px solid var(--border);
  color:var(--text); border-radius:10px; font-size:16px; font-family:inherit;
}
.fg input:focus, .fg select:focus, .fg textarea:focus{outline:none; border-color:var(--gold);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 18px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text); font-size:14px; font-weight:600;
  font-family:inherit; cursor:pointer; transition:all .15s ease;
}
.btn:hover{border-color:var(--gold);}
.btn-primary{background:var(--gold); color:#1a1206; border-color:var(--gold);}
.btn-primary:hover{background:var(--gold-bright);}
.btn-green{background:var(--green); color:#04140b; border-color:var(--green);}
.btn-danger{background:transparent; color:var(--red-soft); border-color:var(--red);}
.btn-ghost{background:transparent;}
.btn-block{width:100%;}
.login-msg{font-size:13px; text-align:center; margin-top:12px; min-height:18px;}
.login-msg.error{color:var(--red-soft);}

/* ===== APP LAYOUT ===== */
#appView{display:none; min-height:100vh; padding-bottom:40px;}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:50;
}
.topbar .logo{font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--gold);}
.topbar .logo small{display:block; font-size:9px; letter-spacing:2px; color:var(--muted); font-family:'Outfit'; text-transform:uppercase;}
.live-dot{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--green-soft); background:rgba(46,194,122,0.12); padding:4px 10px; border-radius:20px; font-weight:600;}
.live-dot::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--green); }
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
.user-chip{display:flex; align-items:center; gap:8px;}
.user-chip .av{width:36px; height:36px; border-radius:50%; background:var(--gold); color:#1a1206; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
.user-chip .info .n{font-size:13px; font-weight:600;}
.user-chip .info .r{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}

.nav{
  display:flex; gap:4px; padding:12px 20px 0; flex-wrap:wrap; max-width:1100px; margin:0 auto;
}
.nav button{
  background:transparent; border:none; color:var(--text-2); padding:10px 16px;
  border-radius:10px 10px 0 0; font-size:14px; font-weight:600; font-family:inherit;
  cursor:pointer; display:inline-flex; align-items:center; gap:7px;
}
.nav button.active{background:var(--gold); color:#1a1206;}
.nav button:not(.active):hover{color:var(--text); background:var(--surface-2);}

.container{max-width:1100px; margin:0 auto; padding:20px;}
.screen-header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
.screen-header h1{font-size:24px; font-weight:700;}
.screen-header .sub{font-size:13px; color:var(--muted); margin-top:2px;}

.search-wrap{position:relative; margin-bottom:16px;}
.search-input{
  width:100%; padding:12px 40px 12px 40px; background:var(--surface); border:1px solid var(--border);
  color:var(--text); border-radius:10px; font-size:15px; font-family:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%237a7a8e' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat:no-repeat; background-position:13px center;
}
.search-input:focus{outline:none; border-color:var(--gold);}
.search-clear{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:24px; height:24px; border:none; background:var(--surface-2); color:var(--muted); border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:15px; padding:0;}
.search-clear:hover{color:var(--text); background:var(--border);}
.search-wrap.has-text .search-clear{display:flex;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow-sm);}
.cli-card{display:flex; align-items:center; gap:14px; cursor:pointer; transition:border-color .15s;}
.cli-card:hover{border-color:var(--gold);}
.cli-card .av{width:46px; height:46px; border-radius:12px; background:var(--surface-2); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px; flex-shrink:0;}
.cli-card .info{flex:1; min-width:0;}
.cli-card .info h3{font-size:16px; font-weight:700; margin-bottom:2px;}
.cli-card .info p{font-size:12px; color:var(--muted);}
.tag{display:inline-block; font-size:10px; padding:3px 8px; border-radius:6px; font-weight:600; letter-spacing:0.3px;}
.tag.negocio{background:rgba(75,163,224,0.15); color:var(--blue);}
.tag.particular{background:rgba(168,114,232,0.15); color:var(--purple);}
.cli-card .saldo{text-align:right; flex-shrink:0;}
.cli-card .saldo .v{font-size:18px; font-weight:800; color:var(--gold);}
.cli-card .saldo .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state svg{opacity:0.4; margin-bottom:12px;}
.empty-state h3{font-size:17px; color:var(--text-2); margin-bottom:6px; font-family:'Fraunces';}
.empty-state p{font-size:13px;}

/* ===== MODAL ===== */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
  z-index:200; align-items:center; justify-content:center; padding:16px; overflow-x:hidden;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  max-width:480px; width:100%; max-height:92vh; overflow-y:auto; overflow-x:hidden; padding:24px;
  position:relative; overscroll-behavior:contain;
}
.modal *{max-width:100%; box-sizing:border-box;}
.modal h2{font-size:20px; margin-bottom:18px;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions .btn{flex:1;}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.modal-msg{font-size:13px; margin-top:10px; min-height:16px;}
.modal-msg.error{color:var(--red-soft);}
.modal-msg.ok{color:var(--green-soft);}

/* ===== TOAST ===== */
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
  background:var(--surface-3); border:1px solid var(--border); color:var(--text);
  padding:12px 20px; border-radius:12px; font-size:14px; font-weight:500;
  box-shadow:var(--shadow); z-index:500; transition:transform .3s ease; max-width:90%;
}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.s{border-color:var(--green);}
#toast.e{border-color:var(--red);}

.section-count{font-size:12px; color:var(--muted); margin-bottom:12px;}
.detail-banner{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px;}
.detail-banner .av-big{width:60px; height:60px; border-radius:14px; background:var(--gold); color:#1a1206; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px;}
.detail-banner h2{font-size:22px;}
.detail-banner p{font-size:13px; color:var(--muted); margin-top:3px;}
.kpi-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px;}
.kpi .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
.kpi .v{font-size:22px; font-weight:800;}
.kpi.gold .v{color:var(--gold);} .kpi.green .v{color:var(--green-soft);} .kpi.red .v{color:var(--red-soft);}
@media(max-width:560px){ .kpi-row{grid-template-columns:1fr;} .row-2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo">MERCANTIL YUMANA</div>
      <div class="sub">Ventas al Mayor</div>
    </div>
    <div class="login-title">Inicia sesión para continuar</div>
    <div class="fg">
      <label>Usuario</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="Tu usuario">
    </div>
    <div class="fg">
      <label>Contraseña</label>
      <input type="password" id="loginPass" autocomplete="current-password" placeholder="Tu contraseña">
    </div>
    <button class="btn btn-primary btn-block" id="btnLogin">Entrar</button>
    <div class="login-msg" id="loginMsg"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView">
  <div class="topbar">
    <div class="logo">MERCANTIL YUMANA<small>Ventas al Mayor</small></div>
    <span class="live-dot">EN VIVO</span>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="av" id="userAv">K</div>
        <div class="info"><div class="n" id="userName">—</div><div class="r" id="userRol">—</div></div>
      </div>
      <button class="btn btn-ghost" id="btnTheme" title="Tema" style="padding:8px 10px;">🌙</button>
      <button class="btn btn-danger" id="btnLogout">Salir</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" data-view="clientes">Clientes</button>
    <button class="nav-btn" data-view="usuarios" id="navUsuarios">Usuarios</button>
  </div>

  <!-- ===== VISTA CLIENTES ===== -->
  <div class="container view-section" id="view-clientes">
    <div class="screen-header">
      <div><h1>Clientes <em>mayoristas</em></h1><div class="sub" id="cliSub">—</div></div>
      <button class="btn btn-primary" id="btnNuevoCliente">+ Nuevo cliente</button>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="cliSearch" placeholder="Buscar por nombre, RIF o teléfono...">
    </div>
    <div id="cliList"></div>
  </div>

  <!-- ===== VISTA USUARIOS ===== -->
  <div class="container view-section" id="view-usuarios" style="display:none;">
    <div class="screen-header">
      <div><h1>Usuarios del <em>sistema</em></h1><div class="sub">Quién puede acceder al mayorista</div></div>
      <button class="btn btn-primary" id="btnNuevoUsuario">+ Nuevo usuario</button>
    </div>
    <div id="usuList"></div>
  </div>
</div>

<!-- ===== MODAL CLIENTE ===== -->
<div class="modal-overlay" id="modalCliente">
  <div class="modal">
    <h2 id="modalClienteTitle">Nuevo cliente</h2>
    <div class="fg">
      <label>Nombre del negocio o persona *</label>
      <input type="text" id="ncNombre" placeholder="Ej: Comercial El Águila">
    </div>
    <div class="row-2">
      <div class="fg">
        <label>Tipo</label>
        <select id="ncTipo"><option value="negocio">Negocio</option><option value="particular">Particular</option></select>
      </div>
      <div class="fg">
        <label>Plazo de pago (días)</label>
        <input type="number" id="ncPlazo" value="30" inputmode="numeric">
      </div>
    </div>
    <div class="fg">
      <label>RIF / Cédula (opcional)</label>
      <input type="text" id="ncRif" placeholder="J-12345678-9">
    </div>
    <div class="fg">
      <label>Teléfono (opcional)</label>
      <input type="text" id="ncTelefono" placeholder="0412-1234567">
    </div>
    <div class="fg">
      <label>Dirección (opcional)</label>
      <input type="text" id="ncDireccion" placeholder="Dirección del negocio">
    </div>
    <div class="fg">
      <label>Notas (opcional)</label>
      <textarea id="ncNotas" rows="2" placeholder="Notas internas"></textarea>
    </div>
    <div class="modal-msg" id="ncMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="ncCancelar">Cancelar</button>
      <button class="btn btn-primary" id="ncGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL USUARIO ===== -->
<div class="modal-overlay" id="modalUsuario">
  <div class="modal">
    <h2 id="modalUsuarioTitle">Nuevo usuario</h2>
    <div class="fg"><label>Nombre completo *</label><input type="text" id="nuNombre" placeholder="Ej: Fayssal Slikah"></div>
    <div class="fg"><label>Usuario (para iniciar sesión) *</label><input type="text" id="nuUsuario" placeholder="fayssal" autocapitalize="off"></div>
    <div class="fg"><label>Contraseña *</label><input type="text" id="nuClave" placeholder="Contraseña"></div>
    <div class="fg"><label>Rol</label><select id="nuRol"><option value="vendedor">Vendedor (opera, no borra clientes)</option><option value="admin">Admin (acceso total)</option></select></div>
    <div class="modal-msg" id="nuMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="nuCancelar">Cancelar</button>
      <button class="btn btn-primary" id="nuGuardar">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://tkkiuxaamdyfbildcvtp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oOCXiFi1MaOChwvqiLNSdg_IVfega0X';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var CURRENT_USER = null;
var CLIENTES = [];
var USUARIOS = [];
var FACTURAS = [];
var ABONOS = [];
var editingClienteId = null;
var editingUsuarioId = null;

// ===== UTILIDADES =====
function toast(msg, tipo){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = ''; if(tipo) t.classList.add(tipo);
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function fmt(n){ return '$' + (Math.abs(Number(n)||0)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function initials(nombre){
  if(!nombre) return '?';
  var p = nombre.trim().split(/\s+/);
  return (p[0][0] + (p[1]?p[1][0]:'')).toUpperCase();
}
function normalizar(txt){ return (txt||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function fmtDate(d){ if(!d) return '—'; var p = d.toString().substring(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

// ===== LOGIN =====
async function intentarLogin(){
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  var msg = document.getElementById('loginMsg');
  msg.textContent = ''; msg.className = 'login-msg';
  if(!u || !p){ msg.textContent = 'Escribe usuario y contraseña.'; msg.classList.add('error'); return; }
  try {
    var r = await sb.from('may_usuarios').select('*').eq('usuario', u).eq('activo', true).maybeSingle();
    if(r.error) throw r.error;
    if(!r.data || r.data.clave !== p){
      msg.textContent = 'Usuario o contraseña incorrectos.'; msg.classList.add('error'); return;
    }
    CURRENT_USER = r.data;
    try { localStorage.setItem('may_user', JSON.stringify({id:r.data.id})); } catch(e){}
    entrarApp();
  } catch(e){
    msg.textContent = 'Error al conectar. Intenta de nuevo.'; msg.classList.add('error');
  }
}

function entrarApp(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'block';
  document.getElementById('userName').textContent = CURRENT_USER.nombre;
  document.getElementById('userRol').textContent = CURRENT_USER.rol;
  document.getElementById('userAv').textContent = initials(CURRENT_USER.nombre);
  // La pestaña Usuarios solo para admin
  document.getElementById('navUsuarios').style.display = (CURRENT_USER.rol === 'admin') ? '' : 'none';
  cargarDatos();
}

function logout(){
  try { localStorage.removeItem('may_user'); } catch(e){}
  CURRENT_USER = null;
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('loginPass').value = '';
}

// ===== CARGA DE DATOS =====
async function traerTodo(tabla, orderCol, asc){
  var todos = [], desde = 0, tam = 1000;
  while(true){
    var q = sb.from(tabla).select('*');
    if(orderCol) q = q.order(orderCol, {ascending: !!asc});
    var r = await q.range(desde, desde + tam - 1);
    if(r.error) throw r.error;
    var lote = r.data || [];
    todos = todos.concat(lote);
    if(lote.length < tam) break;
    desde += tam;
  }
  return todos;
}

async function cargarDatos(){
  try {
    CLIENTES = (await traerTodo('may_clientes', 'nombre', true)).filter(function(c){ return !c.deleted_at; });
    FACTURAS = (await traerTodo('may_facturas', 'fecha', false)).filter(function(f){ return !f.deleted_at; });
    ABONOS = (await traerTodo('may_abonos', 'fecha', false)).filter(function(a){ return !a.deleted_at; });
    if(CURRENT_USER.rol === 'admin'){
      USUARIOS = await traerTodo('may_usuarios', 'nombre', true);
    }
    renderClientes();
    renderUsuarios();
  } catch(e){
    toast('Error al cargar datos', 'e');
  }
}

// Saldo de un cliente = suma facturas pendientes - suma abonos
function saldoCliente(clienteId){
  var totalFacturas = FACTURAS.filter(function(f){ return f.cliente_id === clienteId; })
    .reduce(function(s,f){ return s + parseFloat(f.monto_total||0); }, 0);
  var totalAbonos = ABONOS.filter(function(a){ return a.cliente_id === clienteId; })
    .reduce(function(s,a){ return s + parseFloat(a.monto||0); }, 0);
  return totalFacturas - totalAbonos;
}

// ===== RENDER CLIENTES =====
function renderClientes(){
  var cont = document.getElementById('cliList');
  var search = normalizar(document.getElementById('cliSearch').value).trim();
  var list = CLIENTES.slice();
  if(search){
    list = list.filter(function(c){
      var txt = [c.nombre, c.rif_cedula, c.telefono].filter(Boolean).join(' ');
      return normalizar(txt).indexOf(search) >= 0;
    });
  }
  document.getElementById('cliSub').textContent = CLIENTES.length + ' cliente' + (CLIENTES.length===1?'':'s') + ' registrado' + (CLIENTES.length===1?'':'s');
  if(list.length === 0){
    cont.innerHTML = '<div class="empty-state"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg><h3>' + (search?'Sin resultados':'Aún no hay clientes') + '</h3><p>' + (search?'Prueba con otro término':'Agrega tu primer cliente mayorista con el botón de arriba') + '</p></div>';
    return;
  }
  cont.innerHTML = list.map(function(c){
    var saldo = saldoCliente(c.id);
    return '<div class="card cli-card" data-cli="' + c.id + '">' +
      '<div class="av">' + initials(c.nombre) + '</div>' +
      '<div class="info">' +
        '<h3>' + c.nombre + '</h3>' +
        '<p><span class="tag ' + (c.tipo||'negocio') + '">' + (c.tipo==='particular'?'Particular':'Negocio') + '</span> · Plazo ' + (c.plazo_dias||30) + ' días' + (c.telefono?' · '+c.telefono:'') + '</p>' +
      '</div>' +
      '<div class="saldo"><div class="v">' + fmt(saldo) + '</div><div class="l">Debe</div></div>' +
    '</div>';
  }).join('');
  cont.querySelectorAll('.cli-card').forEach(function(el){
    el.addEventListener('click', function(){ abrirEditarCliente(this.dataset.cli); });
  });
}

// ===== MODAL CLIENTE =====
function abrirNuevoCliente(){
  editingClienteId = null;
  document.getElementById('modalClienteTitle').textContent = 'Nuevo cliente';
  ['ncNombre','ncRif','ncTelefono','ncDireccion','ncNotas'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('ncTipo').value = 'negocio';
  document.getElementById('ncPlazo').value = '30';
  document.getElementById('ncMsg').textContent = '';
  document.getElementById('modalCliente').classList.add('active');
}
function abrirEditarCliente(id){
  var c = CLIENTES.find(function(x){ return x.id === id; });
  if(!c) return;
  editingClienteId = id;
  document.getElementById('modalClienteTitle').textContent = 'Editar cliente';
  document.getElementById('ncNombre').value = c.nombre || '';
  document.getElementById('ncTipo').value = c.tipo || 'negocio';
  document.getElementById('ncPlazo').value = c.plazo_dias || 30;
  document.getElementById('ncRif').value = c.rif_cedula || '';
  document.getElementById('ncTelefono').value = c.telefono || '';
  document.getElementById('ncDireccion').value = c.direccion || '';
  document.getElementById('ncNotas').value = c.notas || '';
  document.getElementById('ncMsg').textContent = '';
  document.getElementById('modalCliente').classList.add('active');
}
async function guardarCliente(){
  var nombre = document.getElementById('ncNombre').value.trim();
  var msg = document.getElementById('ncMsg');
  if(!nombre){ msg.className='modal-msg error'; msg.textContent='El nombre es obligatorio.'; return; }
  var data = {
    nombre: nombre,
    tipo: document.getElementById('ncTipo').value,
    plazo_dias: parseInt(document.getElementById('ncPlazo').value) || 30,
    rif_cedula: document.getElementById('ncRif').value.trim() || null,
    telefono: document.getElementById('ncTelefono').value.trim() || null,
    direccion: document.getElementById('ncDireccion').value.trim() || null,
    notas: document.getElementById('ncNotas').value.trim() || null
  };
  try {
    if(editingClienteId){
      var r = await sb.from('may_clientes').update(data).eq('id', editingClienteId);
      if(r.error) throw r.error;
      toast('Cliente actualizado', 's');
    } else {
      var r2 = await sb.from('may_clientes').insert(data);
      if(r2.error) throw r2.error;
      toast('Cliente creado', 's');
    }
    document.getElementById('modalCliente').classList.remove('active');
    await cargarDatos();
  } catch(e){
    msg.className='modal-msg error'; msg.textContent = 'Error al guardar: ' + e.message;
  }
}

// ===== RENDER USUARIOS =====
function renderUsuarios(){
  if(CURRENT_USER.rol !== 'admin') return;
  var cont = document.getElementById('usuList');
  if(USUARIOS.length === 0){ cont.innerHTML = '<div class="empty-state"><p>Sin usuarios</p></div>'; return; }
  cont.innerHTML = USUARIOS.map(function(u){
    return '<div class="card cli-card" data-usu="' + u.id + '">' +
      '<div class="av">' + initials(u.nombre) + '</div>' +
      '<div class="info"><h3>' + u.nombre + '</h3><p>Usuario: ' + u.usuario + ' · <span class="tag ' + (u.rol==='admin'?'particular':'negocio') + '">' + (u.rol==='admin'?'Admin':'Vendedor') + '</span>' + (u.activo?'':' · <span style="color:var(--red-soft)">Inactivo</span>') + '</p></div>' +
    '</div>';
  }).join('');
  cont.querySelectorAll('.cli-card').forEach(function(el){
    el.addEventListener('click', function(){ abrirEditarUsuario(this.dataset.usu); });
  });
}
function abrirNuevoUsuario(){
  editingUsuarioId = null;
  document.getElementById('modalUsuarioTitle').textContent = 'Nuevo usuario';
  ['nuNombre','nuUsuario','nuClave'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('nuRol').value = 'vendedor';
  document.getElementById('nuMsg').textContent = '';
  document.getElementById('modalUsuario').classList.add('active');
}
function abrirEditarUsuario(id){
  var u = USUARIOS.find(function(x){ return x.id === id; });
  if(!u) return;
  editingUsuarioId = id;
  document.getElementById('modalUsuarioTitle').textContent = 'Editar usuario';
  document.getElementById('nuNombre').value = u.nombre;
  document.getElementById('nuUsuario').value = u.usuario;
  document.getElementById('nuClave').value = u.clave;
  document.getElementById('nuRol').value = u.rol;
  document.getElementById('nuMsg').textContent = '';
  document.getElementById('modalUsuario').classList.add('active');
}
async function guardarUsuario(){
  var msg = document.getElementById('nuMsg');
  var nombre = document.getElementById('nuNombre').value.trim();
  var usuario = document.getElementById('nuUsuario').value.trim().toLowerCase();
  var clave = document.getElementById('nuClave').value;
  if(!nombre || !usuario || !clave){ msg.className='modal-msg error'; msg.textContent='Completa todos los campos.'; return; }
  var data = { nombre:nombre, usuario:usuario, clave:clave, rol:document.getElementById('nuRol').value };
  try {
    if(editingUsuarioId){
      var r = await sb.from('may_usuarios').update(data).eq('id', editingUsuarioId);
      if(r.error) throw r.error;
      toast('Usuario actualizado', 's');
    } else {
      var r2 = await sb.from('may_usuarios').insert(data);
      if(r2.error) throw r2.error;
      toast('Usuario creado', 's');
    }
    document.getElementById('modalUsuario').classList.remove('active');
    await cargarDatos();
  } catch(e){
    msg.className='modal-msg error';
    msg.textContent = (e.message && e.message.indexOf('duplicate')>=0) ? 'Ese nombre de usuario ya existe.' : ('Error: ' + e.message);
  }
}

// ===== NAVEGACIÓN =====
function switchView(view){
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.view === view); });
  document.querySelectorAll('.view-section').forEach(function(s){ s.style.display = 'none'; });
  document.getElementById('view-' + view).style.display = 'block';
}

// ===== TEMA =====
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') || 'dark';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('btnTheme').textContent = next === 'dark' ? '🌙' : '☀️';
  try { localStorage.setItem('may_theme', next); } catch(e){}
}

// ===== BÚSQUEDA CON X =====
function initSearchClear(){
  var input = document.getElementById('cliSearch');
  var wrap = input.closest('.search-wrap');
  var btn = document.createElement('button');
  btn.type='button'; btn.className='search-clear'; btn.innerHTML='&times;';
  wrap.appendChild(btn);
  function toggle(){ wrap.classList.toggle('has-text', input.value.length>0); }
  input.addEventListener('input', function(){ toggle(); renderClientes(); });
  btn.addEventListener('click', function(){ input.value=''; toggle(); renderClientes(); input.focus(); });
}

// ===== EVENTOS =====
document.getElementById('btnLogin').addEventListener('click', intentarLogin);
document.getElementById('loginPass').addEventListener('keydown', function(e){ if(e.key==='Enter') intentarLogin(); });
document.getElementById('btnLogout').addEventListener('click', logout);
document.getElementById('btnTheme').addEventListener('click', toggleTheme);
document.querySelectorAll('.nav-btn').forEach(function(b){ b.addEventListener('click', function(){ switchView(this.dataset.view); }); });
document.getElementById('btnNuevoCliente').addEventListener('click', abrirNuevoCliente);
document.getElementById('ncCancelar').addEventListener('click', function(){ document.getElementById('modalCliente').classList.remove('active'); });
document.getElementById('ncGuardar').addEventListener('click', guardarCliente);
document.getElementById('btnNuevoUsuario').addEventListener('click', abrirNuevoUsuario);
document.getElementById('nuCancelar').addEventListener('click', function(){ document.getElementById('modalUsuario').classList.remove('active'); });
document.getElementById('nuGuardar').addEventListener('click', guardarUsuario);
document.querySelectorAll('.modal-overlay').forEach(function(ov){
  ov.addEventListener('click', function(e){ if(e.target === ov) ov.classList.remove('active'); });
});

// Tema guardado
try { var th = localStorage.getItem('may_theme'); if(th){ document.documentElement.setAttribute('data-theme', th); document.getElementById('btnTheme').textContent = th==='dark'?'🌙':'☀️'; } } catch(e){}

initSearchClear();

// Auto-login si hay sesión guardada
(async function(){
  try {
    var saved = localStorage.getItem('may_user');
    if(saved){
      var id = JSON.parse(saved).id;
      var r = await sb.from('may_usuarios').select('*').eq('id', id).eq('activo', true).maybeSingle();
      if(r.data){ CURRENT_USER = r.data; entrarApp(); }
    }
  } catch(e){}
})();
</script>
